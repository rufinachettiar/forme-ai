
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>
:root {

  --cream: #f8f5ef;
  --paper: #fffdf9;
  --soft: #f0f0e7;
  --border: #d8d8ca;

}

* { box-sizing: border-box; }

html { scroll-behavior: auto; }

body {

  background: var(--cream);
  color: var(--ink);
  font-family: Georgia, "Times New Roman", serif;
  -webkit-font-smoothing: antialiased;
}

button, input, select {

}

button { cursor: pointer; }

button:focus-visible,
input:focus-visible,
select:focus-visible {

}

[hidden] { display: none !important; }

.app {

.brand {

}

.brand-dot { color: #6c806c; }

.top-label {

  white-space: nowrap;
}

.hero {

  padding: 43px 0 24px;
}

.hero h1 {

  font-weight: normal;

}

.meta {

.meta-item {

}

.meta svg {

}

}

.equipment strong {

.exercise-list {

}

.exercise-card {

}

.photo {

  background: #eae7df;

}

.photo img {

.photo-fallback {

}

.photo-fallback span {

.exercise-name {

.exercise-name p {

.set-area {

.set-heading {

.set-grid {

.set-box {

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}

const STORAGE_KEY = "forme_v06";

function readJSON(key) {
  try {
    return JSON.parse(localStorage.getItem(key));
  } catch {
    return null;
  }
}

let db = readJSON(STORAGE_KEY);

if (!db || typeof db !== "object") {
  db = {
    history: [],
    customWeights: {},
    draft: null,
    migrated: false
  };
}

if (!Array.isArray(db.history)) db.history = [];
if (!db.customWeights || typeof db.customWeights !== "object") {
  db.customWeights = {};
}
if (!("draft" in db)) db.draft = null;

function save() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
    return true;
  } catch {
    alert("Your browser could not save this workout.");
    return false;
  }
}

/*
Import previous completed history once.

Different earlier versions may have different
data structures. We preserve records rather
than attempting to reinterpret every field.
*/

if (!db.migrated) {
  const previousKeys = [
    "forme_v05",
    "forme_v04",
    "forme_v03",
    "forme_v02"
  ];

  for (const key of previousKeys) {
    const old = readJSON(key);

    if (old && Array.isArray(old.history)) {
      db.history = old.history.map((item, index) => ({
        ...item,
        id: "legacy-" + key + "-" + index
      }));

      if (old.customWeights &&
          typeof old.customWeights === "object") {
        db.customWeights = {
          ...old.customWeights
        };
      }

      break;
    }
  }

  if (!db.history.length) {
    const legacyLogs = readJSON("forme_logs");

    if (Array.isArray(legacyLogs)) {
      db.history = legacyLogs.map((item, index) => ({
        ...item,
        id: "legacy-logs-" + index
      }));
    }
  }

  db.migrated = true;
  save();
}

const main = document.getElementById("main");

let selectedDay = (new Date().getDay() + 6) % 7;
let currentTab = "today";
let session = null;

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[char]));
}

function workoutKey(day, exerciseIndex) {
  return day + "-" + exerciseIndex;
}

function plannedWeights(day, exerciseIndex) {
  const ex = PLAN[day].exercises[exerciseIndex];
  const custom = db.customWeights[
    workoutKey(day, exerciseIndex)
  ];

  if (
    Array.isArray(custom) &&
    custom.length === ex.reps.length
  ) {
    return custom.map(Number);
  }

  return [...ex.weights];
}

function getDaySets(day) {
  return PLAN[day].exercises.map((ex, i) => {
    const weights = plannedWeights(day, i);

    return ex.reps.map((reps, j) => ({
      reps,
      weight: weights[j],
      done: false
    }));
  });
}

function equipmentFor(day, sets = null) {
  const weights = new Set();
  let needsMat = false;

  PLAN[day].exercises.forEach((ex, i) => {
    const values = sets
      ? sets[i].map(s => s.weight)
      : plannedWeights(day, i);

    if (ex.equipment !== "body") {
      values.forEach(w => {
        if (Number(w) > 0) weights.add(Number(w));
      });
    }

    if (/floor|dead bug|bird dog|plank|bridge|crunch|stretch|mobility|cat-cow/i
        .test(ex.name)) {
      needsMat = true;
    }
  });

  const result = [...weights]
    .sort((a,b) => a-b)
    .map(w => w + " lb");

  if (needsMat) result.push("Yoga mat");

  return result.length ? result.join(" · ") : "No equipment";
}

function photoHTML(ex) {
  const name = escapeHTML(ex.name);
  const filename = encodeURIComponent(ex.image);

  return `
    <div class="photo">
      <img
        src="media/${filename}"
        alt="${name}"
        loading="lazy"
        onerror="
          this.hidden=true;
          this.nextElementSibling.hidden=false;
        "
      >
      <div class="photo-fallback" hidden>
        <span>forme.</span>
        <div>${name}</div>
      </div>
    </div>
  `;
}

function setHTML(ex, set, index, interactive, exerciseIndex) {
  const unit = ex.unit;

  const label = unit === "min"
    ? "min"
    : unit === "sec"
      ? "sec"
      : "reps";

  const weight = ex.equipment === "body"
    ? ""
    : `<span class="set-weight">
        ${escapeHTML(set.weight)} lb
       </span>`;

  return `
    <button
      type="button"
      class="set-box ${set.done ? "complete" : ""}"
      ${interactive
        ? `data-ex="${exerciseIndex}" data-set="${index}"`
        : "disabled"}
      aria-pressed="${set.done ? "true" : "false"}"
      aria-label="Set ${index+1},
        ${set.reps} ${label},
        ${ex.equipment === "body"
          ? "bodyweight"
          : set.weight + " pounds"},
        ${set.done ? "completed" : "not completed"}"
    >
      <span class="set-label">Set ${index+1}</span>
      <span class="set-reps">
        ${escapeHTML(set.reps)} ${label}
      </span>
      ${weight}
    </button>
  `;
}

function exerciseCard(ex, sets, exerciseIndex, interactive) {
  return `
    <article class="exercise-card">
      ${photoHTML(ex)}

      <div class="exercise-name">
        <h2>${escapeHTML(ex.name)}</h2>
        ${interactive
          ? `<p>${escapeHTML(ex.cue)}</p>`
          : ""}
      </div>

      <div class="set-area">
        <div class="set-heading">Sets</div>
        <div class="set-grid">
          ${sets.map((set, i) =>
            setHTML(ex, set, i, interactive, exerciseIndex)
          ).join("")}
        </div>

        ${interactive ? `
          <details>
            <summary>Adjust reps / weight</summary>
            ${sets.map((set, i) => `
              <div class="edit-grid">
                <div class="set-number">${i+1}</div>

                <label>
                  ${ex.unit === "reps"
                    ? "Reps"
                    : ex.unit === "min"
                      ? "Minutes"
                      : "Seconds"}
                  <input
                    type="number"
                    min="0"
                    max="999"
                    step="1"
                    value="${set.reps}"
                    data-edit-ex="${exerciseIndex}"
                    data-edit-set="${i}"
                    data-field="reps"
                  >
                </label>

                <label>
                  Weight (lb)
                  <input
                    type="number"
                    min="0"
                    max="100"
                    step="1"
                    value="${set.weight}"
                    ${ex.equipment === "body"
                      ? "disabled"
                      : ""}
                    data-edit-ex="${exerciseIndex}"
                    data-edit-set="${i}"
                    data-field="weight"
                  >
                </label>
              </div>
            `).join("")}
          </details>
        ` : ""}
      </div>
    </article>
  `;
}

function heroHTML(day) {
  const w = PLAN[day];

  return `
    <section class="hero">
      <h1>${escapeHTML(w.title)}</h1>

      <div class="meta">
        <span class="meta-item">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="9"></circle>
            <path d="M12 6v6l4 3"></path>
          </svg>
          ~${w.minutes} minutes
        </span>

        <span class="meta-item">
          <svg viewBox="0 0 24 24">
            <path d="M3 9v6M6 6v12M9 9v6
              M15 9v6M18 6v12M21 9v6M9 12h6"></path>
          </svg>
          Dumbbells
        </span>

        <span class="meta-item">
          <svg viewBox="0 0 24 24">
            <path d="M3 15l13-9 5 3-13 9z"></path>
            <path d="M3 15v3l5 3 13-9V9"></path>
          </svg>
          Mat
        </span>
      </div>
    </section>
  `;
}

function daySelectorHTML() {
  return `
    <section class="section">
      <h3>Your Weekly Plan</h3>
      <div class="day-list">
        ${PLAN.map((w,i) => `
          <button
            type="button"
            class="day ${i === selectedDay ? "active" : ""}"
            data-day="${i}"
          >
            <span>
              <strong>${DAYS[i]}</strong>
              <small>${escapeHTML(w.title)}</small>
            </span>
            <span class="day-time">
              ${w.minutes} min
            </span>
          </button>
        `).join("")}
      </div>
    </section>
  `;
}

function renderToday() {
  currentTab = "today";
  updateNav();

  if (session) {
    renderSession();
    return;
  }

  const day = selectedDay;
  const w = PLAN[day];

  main.innerHTML = `
    ${heroHTML(day)}

    <div class="equipment">
      <strong>Today's Equipment:</strong>
      ${escapeHTML(equipmentFor(day))}
    </div>

    ${db.draft ? `
      <div class="panel">
        <h3>Unfinished Workout</h3>
        <p class="small-text">
          Your previous session is saved.
        </p>
        <button
          type="button"
          class="action"
          id="resumeBtn"
        >
          Resume Workout
        </button>
      </div>
    ` : ""}

    <div class="exercise-list">
      ${w.exercises.map((ex,i) => {
        const sets = ex.reps.map((reps,j) => ({
          reps,
          weight: plannedWeights(day,i)[j],
          done: false
        }));

        return exerciseCard(ex,sets,i,false);
      }).join("")}
    </div>

    <div class="actions">
      <button
        type="button"
        class="action"
        id="startBtn"
      >
        Start Workout
      </button>
    </div>

    ${daySelectorHTML()}
  `;

  document.getElementById("startBtn")
    .addEventListener("click", startWorkout);

  const resume = document.getElementById("resumeBtn");
  if (resume) resume.addEventListener("click", resumeWorkout);

  bindDayButtons();
}

function bindDayButtons() {
  document.querySelectorAll("[data-day]").forEach(btn => {
    btn.addEventListener("click", () => {
      selectedDay = Number(btn.dataset.day);
      renderToday();
      window.scrollTo(0,0);
    });
  });
}

function startWorkout() {
  if (db.draft) {
    if (!confirm(
      "Replace your unfinished workout with a new one?"
    )) return;
  }

  session = {
    day: selectedDay,
    startedAt: new Date().toISOString(),
    sets: getDaySets(selectedDay)
  };

  db.draft = session;

  if (!save()) {
    session = null;
    return;
  }

  renderSession();
  window.scrollTo(0,0);
}

function validDraft(draft) {
  if (!draft ||
      !Number.isInteger(draft.day) ||
      !PLAN[draft.day] ||
      !Array.isArray(draft.sets)) {
    return false;
  }

  const exercises = PLAN[draft.day].exercises;

  return draft.sets.length === exercises.length &&
    draft.sets.every((sets,i) =>
      Array.isArray(sets) &&
      sets.length === exercises[i].reps.length &&
      sets.every(s =>
        s &&
        Number.isFinite(Number(s.reps)) &&
        Number.isFinite(Number(s.weight))
      )
    );
}

function resumeWorkout() {
  if (!validDraft(db.draft)) {
    alert("The saved session cannot be resumed.");
    return;
  }

  session = db.draft;
  selectedDay = session.day;

  renderSession();
  window.scrollTo(0,0);
}

function completionStats() {
  const all = session.sets.flat();
  return {
    done: all.filter(s => s.done).length,
    total: all.length
  };
}

function renderSession() {
  const day = session.day;
  const w = PLAN[day];
  const stats = completionStats();
  const percent = stats.total
    ? Math.round(stats.done / stats.total * 100)
    : 0;

  main.innerHTML = `
    ${heroHTML(day)}

    <div class="equipment">
      <strong>Today's Equipment:</strong>
      ${escapeHTML(equipmentFor(day,session.sets))}
    </div>

    <div class="panel">
      <div class="small-text">
        <strong>${stats.done} of ${stats.total}</strong>
        sets complete · ${percent}%
      </div>
      <div class="progress-line">
        <div
          class="progress-fill"
          style="width:${percent}%"
        ></div>
      </div>
    </div>

    <div class="exercise-list">
      ${w.exercises.map((ex,i) =>
        exerciseCard(ex,session.sets[i],i,true)
      ).join("")}
    </div>

    <div class="actions">
      <button
        type="button"
        class="action"
        id="finishBtn"
      >
        Finish Workout ✓
      </button>

      <button
        type="button"
        class="action secondary"
        id="saveExitBtn"
      >
        Save & Exit
      </button>
    </div>
  `;

  document.querySelectorAll(
    ".set-box[data-ex]"
  ).forEach(btn => {
    btn.addEventListener("click", () => {
      const i = Number(btn.dataset.ex);
      const j = Number(btn.dataset.set);
      const set = session.sets[i][j];

      set.done = !set.done;
      btn.classList.toggle("complete",set.done);
      btn.setAttribute(
        "aria-pressed",
        set.done ? "true" : "false"
      );

      const label = btn.querySelector(".set-label");
      if (label) label.textContent = "Set " + (j+1);

      db.draft = session;
      save();
      refreshProgress();
    });
  });

  document.querySelectorAll(
    "input[data-edit-ex]"
  ).forEach(input => {
    input.addEventListener("change", () => {
      const i = Number(input.dataset.editEx);
      const j = Number(input.dataset.editSet);
      const field = input.dataset.field;
      const value = Number(input.value);

      if (!Number.isFinite(value) ||
          value < 0 ||
          value > 999 ||
          !Number.isInteger(value)) {
        alert("Enter a valid non-negative whole number.");
        input.value = session.sets[i][j][field];
        return;
      }

      session.sets[i][j][field] = value;
      db.draft = session;
      save();

      const card = input.closest(".exercise-card");
      const setBox = card.querySelectorAll(".set-box")[j];

      if (field === "reps") {
        const unit = PLAN[day].exercises[i].unit;
        const text = unit === "reps" ? "reps" : unit;

        setBox.querySelector(".set-reps").textContent =
          value + " " + text;
      } else {
        const weightLabel =
          setBox.querySelector(".set-weight");

        if (weightLabel) {
          weightLabel.textContent = value + " lb";
        }
      }

      const equipment = main.querySelector(".equipment");
      equipment.innerHTML =
        "<strong>Today's Equipment:</strong> " +
        escapeHTML(equipmentFor(day,session.sets));
    });
  });

  document.getElementById("finishBtn")
    .addEventListener("click", finishWorkout);

  document.getElementById("saveExitBtn")
    .addEventListener("click", () => {
      db.draft = session;
      if (!save()) return;
      session = null;
      renderToday();
      window.scrollTo(0,0);
    });
}

function refreshProgress() {
  const stats = completionStats();
  const percent = stats.total
    ? Math.round(stats.done / stats.total * 100)
    : 0;

  const panel = main.querySelector(".panel");
  if (!panel) return;

  panel.querySelector(".small-text").innerHTML =
    "<strong>" + stats.done + " of " +
    stats.total + "</strong> sets complete · " +
    percent + "%";

  panel.querySelector(".progress-fill")
    .style.width = percent + "%";
}

function finishWorkout() {
  const stats = completionStats();

  if (stats.done === 0) {
    alert("Mark at least one set complete first.");
    return;
  }

  if (!confirm("Finish and save this workout?")) {
    return;
  }

  const day = session.day;

  const record = {
    id: "forme-" + Date.now() + "-" +
      Math.random().toString(36).slice(2,8),
    date: new Date().toISOString(),
    name: PLAN[day].title,
    day,
    completed: stats.done,
    total: stats.total,
    details: PLAN[day].exercises.map((ex,i) => ({
      name: ex.name,
      unit: ex.unit,
      sets: session.sets[i].map(s => ({...s}))
    }))
  };

  db.history.push(record);

  /*
  Remember the actual weights used for
  exercises whose sets were all completed.
  This does not automatically increase weights.
  */

  session.sets.forEach((sets,i) => {
    if (sets.every(s => s.done)) {
      db.customWeights[workoutKey(day,i)] =
        sets.map(s => s.weight);
    }
  });

  db.draft = null;

  if (!save()) {
    db.history.pop();
    db.draft = session;
    return;
  }

  session = null;
  renderProgress();
  window.scrollTo(0,0);
}

function safeDate(value) {
  const date = new Date(value);
  return Number.isNaN(date.getTime())
    ? "Previous workout"
    : date.toLocaleDateString(undefined,{
        month:"short",day:"numeric",year:"numeric"
      });
}

function renderProgress() {
  currentTab = "progress";
  updateNav();

  const history = [...db.history].reverse();
  const totalSets = db.history.reduce(
    (sum,item) => sum + (Number(item.completed)||0),0
  );

  main.innerHTML = `
    <section class="hero">
      <h1>Your Progress</h1>
      <div class="meta">
        <span>${db.history.length} workouts</span>
        <span>${totalSets} completed sets</span>
      </div>
    </section>

    <div class="panel">
      <h3>Workout History</h3>

      ${history.length ? history.map(item => `
        <div class="history-item">
          <div class="history-title">
            <strong>
              ${escapeHTML(item.name || "Workout")}
            </strong>
            <button
              type="button"
              class="delete-btn"
              data-delete-id="${escapeHTML(item.id)}"
            >
              Delete
            </button>
          </div>

          <p class="small-text">
            ${escapeHTML(safeDate(item.date))}
            · ${Number(item.completed)||0}
            / ${Number(item.total)||0} recorded sets
          </p>

          ${Array.isArray(item.details) ? `
            <details>
              <summary>View sets and weights</summary>

              ${item.details.map(ex => `
                <p class="small-text">
                  <strong>${escapeHTML(ex.name)}</strong>
                  ${Array.isArray(ex.sets)
                    ? ex.sets.map((s,i) => `
                      <br>
                      Set ${i+1}: ${escapeHTML(s.reps)}
                      ${escapeHTML(ex.unit || "reps")}
                      ${Number(s.weight)>0
                        ? " · " + escapeHTML(s.weight) + " lb"
                        : ""}
                      ${s.done ? " ✓" : ""}
                    `).join("")
                    : ""}
                </p>
              `).join("")}
            </details>
          ` : ""}
        </div>
      `).join("") : `
        <p class="small-text">
          Your completed workouts will appear here.
        </p>
      `}
    </div>

    <div class="panel">
      <h3>How Your Weights Progress</h3>
      <p class="small-text">
        Forme remembers the weights you actually used
        when you complete every set of an exercise.
        You can adjust them in your next session.
        Weight increases are not automatic.
      </p>
    </div>

    <p class="small-text">
      Your workout history is stored on this device
      in this browser. It is not synced across devices.
    </p>
  `;

  main.querySelectorAll("[data-delete-id]")
    .forEach(btn => {
      btn.addEventListener("click", () => {
        if (!confirm("Delete this workout?")) return;

        const id = btn.dataset.deleteId;

        db.history = db.history.filter(
          item => String(item.id) !== id
        );

        save();
        renderProgress();
      });
    });
}

function updateNav() {
  document.getElementById("todayNav")
    .classList.toggle("selected",currentTab==="today");

  document.getElementById("progressNav")
    .classList.toggle("selected",currentTab==="progress");

  document.getElementById("topLabel").textContent =
    currentTab === "today"
      ? "Today's Workout"
      : "My Progress";
}

document.getElementById("todayNav")
  .addEventListener("click", () => {
    renderToday();
    window.scrollTo(0,0);
  });

document.getElementById("progressNav")
  .addEventListener("click", () => {
    renderProgress();
    window.scrollTo(0,0);
  });

renderToday();

</script>
</body>
</html>
