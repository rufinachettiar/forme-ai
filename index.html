
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f8f5ef">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Forme AI — Today's Workout</title>
<style>
:root {
  --cream:#f8f5ef;
  --white:#fffdfa;
  --green:#1e3022;
  --sage:#788f79;
  --light:#eeefe5;
  --border:#d8d9cb;
  --muted:#727b71;
}
* { box-sizing:border-box; }
[hidden] { display:none!important; }
body {
  margin:0;
  background:var(--cream);
  color:var(--green);
  font-family:Georgia,"Times New Roman",serif;
  -webkit-font-smoothing:antialiased;
}
button,input { font:inherit; }
button { cursor:pointer; }
button:focus-visible,input:focus-visible {
  outline:2px solid var(--sage);
  outline-offset:2px;
}
.app {
  max-width:1150px;
  margin:auto;
  padding:24px 25px 110px;
}
header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}
.logo {
  font-size:clamp(30px,5vw,54px);
  letter-spacing:-2px;
  white-space:nowrap;
}
.logo span { color:var(--sage); }
.header-title {
  font-size:clamp(15px,2.6vw,30px);
  white-space:nowrap;
}
.hero {
  text-align:center;
  padding:45px 0 27px;
}
.hero h1 {
  font-size:clamp(32px,6vw,68px);
  font-weight:normal;
  line-height:1.08;
  letter-spacing:-1.4px;
  margin:0 0 24px;
}
.meta {
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:14px 35px;
  font-size:clamp(14px,2.3vw,25px);
}
.meta span {
  display:flex;
  align-items:center;
  gap:9px;
}
.meta svg {
  width:27px;
  height:27px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.equipment {
  text-align:center;
  font:13px/1.6 -apple-system,BlinkMacSystemFont,sans-serif;
  color:var(--muted);
  margin:0 0 23px;
}
.equipment strong { color:var(--green); }
.cards {
  display:flex;
  flex-direction:column;
  gap:13px;
}
.exercise {
  display:grid;
  grid-template-columns:22% 33% 45%;
  min-height:175px;
  border:1px solid var(--border);
  border-radius:28px;
  overflow:hidden;
  background:rgba(255,253,250,.92);
}
.photo {
  position:relative;
  background:#eae7df;
  min-height:175px;
  overflow:hidden;
}
.photo img {
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}
.photo-fallback {
  height:100%;
  min-height:175px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:10px;
  color:#788578;
  font:12px -apple-system,sans-serif;
}
.photo-fallback strong {
  font:27px Georgia,serif;
  margin-bottom:8px;
}
.exercise-name {
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:17px 15px 17px 24px;
  min-width:0;
}
.exercise-name h2 {
  font-size:clamp(22px,2.8vw,37px);
  font-weight:normal;
  line-height:1.1;
  letter-spacing:-.5px;
  margin:0;
}
.cue {
  color:var(--muted);
  font:11px/1.4 -apple-system,sans-serif;
  margin:9px 0 0;
}
.set-area {
  min-width:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:11px 18px 11px 0;
}
.set-heading {
  font-size:20px;
  margin-bottom:7px;
}
.set-grid {
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:10px;
}
.set-box {
  border:1px solid #c8cbb9;
  border-radius:22px;
  background:linear-gradient(140deg,#f3f3e9,#ebede3);
  min-height:107px;
  padding:9px 3px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:5px;
  text-align:center;
  color:var(--green);
  line-height:1.12;
}
.set-box span:first-child { font-size:17px; }
.set-box span:not(:first-child) { font-size:20px; }
.set-box.complete {
  background:var(--sage);
  color:white;
  border-color:var(--sage);
}
.set-box.complete span:first-child::before {
  content:"✓ ";
}
.set-box:disabled { cursor:default; }
.actions {
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:10px;
  margin:24px 0;
}
.btn {
  background:var(--green);
  color:white;
  border:1px solid var(--green);
  border-radius:12px;
  padding:13px 21px;
  min-height:45px;
  font:600 14px -apple-system,sans-serif;
}
.btn.secondary {
  background:transparent;
  color:var(--green);
  border-color:var(--border);
}
.panel {
  background:var(--white);
  border:1px solid var(--border);
  border-radius:18px;
  padding:17px;
  margin:15px 0;
}
.panel h3 {
  font-size:25px;
  font-weight:normal;
  margin:0 0 10px;
}
.small {
  font:13px/1.6 -apple-system,sans-serif;
  color:var(--muted);
}
.progress-track {
  height:7px;
  background:#e1e6dc;
  border-radius:10px;
  overflow:hidden;
  margin-top:10px;
}
.progress-fill {
  height:100%;
  background:var(--sage);
}
details { margin-top:12px; }
summary {
  color:var(--sage);
  font:12px -apple-system,sans-serif;
  cursor:pointer;
}
.edit-row {
  display:grid;
  grid-template-columns:42px 1fr 1fr;
  gap:8px;
  align-items:end;
  margin-top:9px;
}
.edit-row label {
  font:11px -apple-system,sans-serif;
  color:var(--muted);
}
.edit-row input {
  width:100%;
  padding:9px;
  margin-top:5px;
  border:1px solid var(--border);
  border-radius:9px;
  background:white;
}
.week {
  margin-top:35px;
}
.week h3 {
  font-size:28px;
  font-weight:normal;
}
.day-list {
  background:var(--white);
  border:1px solid var(--border);
  border-radius:18px;
  overflow:hidden;
}
.day {
  width:100%;
  border:0;
  border-bottom:1px solid var(--border);
  background:transparent;
  padding:14px 17px;
  text-align:left;
  display:flex;
  justify-content:space-between;
  gap:10px;
  color:var(--green);
}
.day:last-child { border-bottom:0; }
.day.active { background:var(--light); }
.day strong {
  font-size:17px;
  font-weight:normal;
}
.day small {
  display:block;
  margin-top:4px;
  font:12px -apple-system,sans-serif;
  color:var(--muted);
}
.history-item {
  padding:13px 0;
  border-bottom:1px solid var(--border);
}
.history-item:last-child { border:0; }
.history-top {
  display:flex;
  justify-content:space-between;
  gap:12px;
}
.delete {
  background:transparent;
  border:0;
  color:#9a6b62;
  font:12px -apple-system,sans-serif;
}
nav {
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  display:flex;
  justify-content:center;
  background:rgba(255,253,250,.98);
  border-top:1px solid var(--border);
  padding:9px 12px calc(9px + env(safe-area-inset-bottom));
  z-index:10;
}
nav button {
  flex:1;
  max-width:230px;
  padding:11px;
  background:transparent;
  border:0;
  border-radius:9px;
  color:var(--muted);
  font:13px -apple-system,sans-serif;
}
nav button.selected {
  background:var(--light);
  color:var(--green);
  font-weight:600;
}
@media(max-width:700px) {
  .app { padding:20px 12px 110px; }
  .hero { padding:34px 0 23px; }
  .exercise {
    grid-template-columns:25% 30% 45%;
    min-height:145px;
    border-radius:19px;
  }
  .photo,.photo-fallback { min-height:145px; }
  .exercise-name { padding:10px 7px 10px 12px; }
  .exercise-name h2 { font-size:clamp(17px,3vw,24px); }
  .set-area { padding:8px 8px 8px 0; }
  .set-heading { font-size:14px; }
  .set-grid { gap:4px; }
  .set-box {
    border-radius:12px;
    min-height:83px;
    padding:5px 1px;
    gap:4px;
  }
  .set-box span:first-child { font-size:11px; }
  .set-box span:not(:first-child) { font-size:12px; }
}
@media(max-width:420px) {
  .logo { font-size:30px; letter-spacing:-1px; }
  .header-title { font-size:15px; }
  .hero h1 { font-size:32px; }
  .meta { gap:10px 15px; font-size:13px; }
  .meta svg { width:20px; height:20px; }
  .exercise { min-height:135px; }
  .photo,.photo-fallback { min-height:135px; }
  .exercise-name h2 { font-size:17px; }
  .cue { font-size:9px; }
  .set-box { min-height:76px; }
  .set-box span:first-child { font-size:10px; }
  .set-box span:not(:first-child) { font-size:11px; }
}
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="logo">forme<span>.</span> ai</div>
    <div class="header-title" id="headerTitle">
      Today's Workout
    </div>
  </header>
  <main id="main"></main>
</div>

<nav>
  <button id="todayNav" class="selected">Today's Workout</button>
  <button id="progressNav">My Progress</button>
</nav>

<script>
"use strict";

const DAYS = [
  "Monday","Tuesday","Wednesday","Thursday",
  "Friday","Saturday","Sunday"
];

function ex(name,reps,weights,kind,image,cue,unit="reps") {
  return {name,reps,weights,kind,image,cue,unit};
}

const PLAN = [
  {
    name:"Full Body Strength A",
    minutes:40,
    exercises:[
      ex("Goblet Squat",
        [15,12,10],[10,15,15],"single",
        "goblet-squat.jpg",
        "Chest tall · Sit between hips"),
      ex("Dumbbell Floor Press",
        [12,10,8],[5,8,10],"pair",
        "floor-press.jpg",
        "Elbows slightly tucked"),
      ex("Bent-over Dumbbell Row",
        [15,12,10],[8,10,10],"pair",
        "bent-over-row.jpg",
        "Hinge at hips · Row toward ribs"),
      ex("Dumbbell Romanian Deadlift",
        [15,12,10],[10,15,15],"pair",
        "romanian-deadlift.jpg",
        "Push hips back · Neutral spine"),
      ex("Dead Bug (per side)",
        [8,8],[0,0],"body",
        "dead-bug.jpg",
        "Slow and controlled")
    ]
  },
  {
    name:"Indoor Walk + Core",
    minutes:30,
    exercises:[
      ex("Indoor Walking",[20],[0],"body",
        "indoor-walk.jpg","Comfortable pace","min"),
      ex("Dead Bug (per side)",[8,8],[0,0],"body",
        "dead-bug.jpg","Keep trunk steady"),
      ex("Bird Dog (per side)",[8,8],[0,0],"body",
        "bird-dog.jpg","Keep hips level")
    ]
  },
  {
    name:"Full Body Strength B",
    minutes:40,
    exercises:[
      ex("Reverse Lunge (per leg)",
        [12,10,8],[0,5,8],"pair",
        "reverse-lunge.jpg","Step back with control"),
      ex("Standing Shoulder Press",
        [15,12,10],[5,8,8],"pair",
        "shoulder-press.jpg","Keep ribs down"),
      ex("Bent-over Dumbbell Row",
        [15,12,10],[8,10,10],"pair",
        "bent-over-row.jpg","Stable torso"),
      ex("Floor Glute Bridge",
        [15,12,10],[0,0,0],"body",
        "glute-bridge.jpg","Squeeze glutes at top"),
      ex("Side Plank (per side)",
        [20,25],[0,0],"body",
        "side-plank.jpg","Keep body aligned","sec")
    ]
  },
  {
    name:"Recovery + Mobility",
    minutes:25,
    exercises:[
      ex("Indoor Walking",[10],[0],"body",
        "indoor-walk.jpg","Easy pace","min"),
      ex("Cat-Cow",[8,8],[0,0],"body",
        "cat-cow.jpg","Gentle movement"),
      ex("Hip Mobility",[5],[0],"body",
        "hip-mobility.jpg","Comfortable range","min"),
      ex("Gentle Stretching",[5],[0],"body",
        "stretching.jpg","Breathe and relax","min")
    ]
  },
  {
    name:"Full Body Circuit",
    minutes:40,
    exercises:[
      ex("Squat to Press",[12,10,8],[5,5,8],"pair",
        "squat-to-press.jpg","Controlled movement"),
      ex("Alternating Reverse Lunge",
        [15,12,10],[0,5,5],"pair",
        "reverse-lunge.jpg","Total reps"),
      ex("Dumbbell Row",
        [15,12,10],[8,10,10],"pair",
        "bent-over-row.jpg","Total reps"),
      ex("Bicycle Crunch",[20,20],[0,0],"body",
        "bicycle-crunch.jpg","Total reps"),
      ex("Wall Sit",[30,40],[0,0],"body",
        "wall-sit.jpg","Keep feet planted","sec")
    ]
  },
  {
    name:"Glutes, Arms + Core",
    minutes:35,
    exercises:[
      ex("Dumbbell Sumo Squat",
        [15,12,10],[10,15,15],"single",
        "sumo-squat.jpg","Knees track over toes"),
      ex("Floor Glute Bridge",
        [15,12,10],[0,0,0],"body",
        "glute-bridge.jpg","Drive through heels"),
      ex("Dumbbell Biceps Curl",
        [15,12,10],[5,8,8],"pair",
        "biceps-curl.jpg","Elbows near sides"),
      ex("Dumbbell Lateral Raise",
        [12,10,8],[5,5,5],"pair",
        "lateral-raise.jpg","Avoid shrugging"),
      ex("Bird Dog (per side)",
        [8,8],[0,0],"body",
        "bird-dog.jpg","Keep hips steady")
    ]
  },
  {
    name:"Easy Walk + Stretch",
    minutes:25,
    exercises:[
      ex("Indoor Walking",[20],[0],"body",
        "indoor-walk.jpg","Relaxed pace","min"),
      ex("Gentle Stretching",[5],[0],"body",
        "stretching.jpg","Comfortable stretch","min")
    ]
  }
];

const KEY="forme_v07";

function load(key) {
  try {
    return JSON.parse(localStorage.getItem(key));
  } catch {
    return null;
  }
}

let db=load(KEY);

if (!db || typeof db!=="object") {
  db={history:[],weights:{},draft:null,migrated:false};
}

db.history=Array.isArray(db.history)?db.history:[];
db.weights=db.weights&&typeof db.weights==="object"
  ?db.weights:{};
db.draft=db.draft||null;

function save() {
  try {
    localStorage.setItem(KEY,JSON.stringify(db));
    return true;
  } catch {
    alert("Could not save workout data.");
    return false;
  }
}

if (!db.migrated) {
  for (const key of [
    "forme_v06","forme_v05","forme_v04",
    "forme_v03","forme_v02"
  ]) {
    const old=load(key);
    if (old && Array.isArray(old.history)) {
      db.history=old.history.map((item,i)=>({
        ...item,
        id:"import-"+key+"-"+i
      }));

      if (old.customWeights) {
        db.weights={...old.customWeights};
      } else if (old.weights) {
        db.weights={...old.weights};
      }
      break;
    }
  }
  db.migrated=true;
  save();
}

const main=document.getElementById("main");
let day=(new Date().getDay()+6)%7;
let session=null;
let tab="today";

function esc(s) {
  return String(s).replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",
    '"':"&quot;","'":"&#39;"
  }[c]));
}

function weightsFor(d,i) {
  const e=PLAN[d].exercises[i];
  const stored=db.weights[d+"-"+i];

  if (Array.isArray(stored) &&
      stored.length===e.reps.length) {
    return stored.map(Number);
  }
  return [...e.weights];
}

function setsFor(d) {
  return PLAN[d].exercises.map((e,i)=>{
    const weights=weightsFor(d,i);
    return e.reps.map((reps,j)=>({
      reps,weight:weights[j],done:false
    }));
  });
}

function equipment(d,sets=null) {
  const values=new Set();
  let mat=false;

  PLAN[d].exercises.forEach((e,i)=>{
    const w=sets
      ?sets[i].map(s=>s.weight)
      :weightsFor(d,i);

    if(e.kind!=="body") {
      w.forEach(n=>{
        if(Number(n)>0) values.add(Number(n));
      });
    }

    if(/floor|dead bug|bird dog|plank|bridge|crunch|stretch|mobility|cat-cow/i
       .test(e.name)) mat=true;
  });

  const result=[...values]
    .sort((a,b)=>a-b)
    .map(n=>n+" lb dumbbells");

  if(mat) result.push("Yoga mat");

  return result.join(" · ")||"No equipment";
}

function hero(d) {
  const w=PLAN[d];

  return `
  <div class="hero">
    <h1>${esc(w.name)}</h1>
    <div class="meta">
      <span>
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9"/>
          <path d="M12 6v6l4 3"/>
        </svg>
        ~${w.minutes} minutes
      </span>
      <span>
        <svg viewBox="0 0 24 24">
          <path d="M3 9v6M6 6v12M9 9v6
          M15 9v6M18 6v12M21 9v6M9 12h6"/>
        </svg>
        Dumbbells
      </span>
      <span>
        <svg viewBox="0 0 24 24">
          <path d="M3 15l13-9 5 3-13 9z"/>
          <path d="M3 15v3l5 3 13-9V9"/>
        </svg>
        Mat
      </span>
    </div>
  </div>`;
}

function photo(e) {
  return `
  <div class="photo">
    <img
      src="media/${encodeURIComponent(e.image)}"
      alt="${esc(e.name)}"
      loading="lazy"
      onerror="
        this.hidden=true;
        this.nextElementSibling.hidden=false;
      "
    >
    <div class="photo-fallback" hidden>
      <strong>forme.</strong>
      <span>${esc(e.name)}</span>
    </div>
  </div>`;
}

function setBox(e,s,j,i,interactive) {
  const unit=e.unit==="reps"?"reps":e.unit;

  return `
  <button
    type="button"
    class="set-box ${s.done?"complete":""}"
    ${interactive
      ?`data-ex="${i}" data-set="${j}"`
      :"disabled"}
    aria-pressed="${s.done?"true":"false"}"
  >
    <span>Set ${j+1}</span>
    <span class="reps">${s.reps} ${unit}</span>
    ${e.kind==="body"
      ?""
      :`<span class="weight">${s.weight} lb</span>`}
  </button>`;
}

function card(e,sets,i,interactive=false) {
  return `
  <article class="exercise">
    ${photo(e)}

    <div class="exercise-name">
      <h2>${esc(e.name)}</h2>
      ${interactive
        ?`<p class="cue">${esc(e.cue)}</p>`
        :""}
    </div>

    <div class="set-area">
      <div class="set-heading">Sets</div>
      <div class="set-grid">
        ${sets.map((s,j)=>
          setBox(e,s,j,i,interactive)
        ).join("")}
      </div>

      ${interactive?`
        <details>
          <summary>Adjust reps / weight</summary>
          ${sets.map((s,j)=>`
            <div class="edit-row">
              <div>${j+1}</div>
              <label>
                ${e.unit==="reps"?"Reps":e.unit}
                <input type="number"
                  min="0" max="999" step="1"
                  value="${s.reps}"
                  data-edit-ex="${i}"
                  data-edit-set="${j}"
                  data-field="reps">
              </label>
              <label>
                Weight (lb)
                <input type="number"
                  min="0" max="100" step="1"
                  value="${s.weight}"
                  ${e.kind==="body"?"disabled":""}
                  data-edit-ex="${i}"
                  data-edit-set="${j}"
                  data-field="weight">
              </label>
            </div>
          `).join("")}
        </details>
      `:""}
    </div>
  </article>`;
}

function nav() {
  document.getElementById("todayNav")
    .classList.toggle("selected",tab==="today");
  document.getElementById("progressNav")
    .classList.toggle("selected",tab==="progress");
  document.getElementById("headerTitle").textContent=
    tab==="today"?"Today's Workout":"My Progress";
}

function renderToday() {
  tab="today";
  nav();

  if(session) {
    renderSession();
    return;
  }

  const w=PLAN[day];

  main.innerHTML=`
    ${hero(day)}

    <div class="equipment">
      <strong>Today's Equipment:</strong>
      ${esc(equipment(day))}
    </div>

    ${db.draft?`
      <div class="panel">
        <h3>Unfinished Workout</h3>
        <p class="small">
          Your previous session is saved.
        </p>
        <button class="btn" id="resume">
          Resume Workout
        </button>
      </div>`:""}

    <div class="cards">
      ${w.exercises.map((e,i)=>{
        const weights=weightsFor(day,i);
        const sets=e.reps.map((reps,j)=>({
          reps,weight:weights[j],done:false
        }));
        return card(e,sets,i);
      }).join("")}
    </div>

    <div class="actions">
      <button class="btn" id="start">
        Start Workout
      </button>
    </div>

    <section class="week">
      <h3>Your Weekly Plan</h3>
      <div class="day-list">
        ${PLAN.map((w,i)=>`
          <button
            class="day ${i===day?"active":""}"
            data-day="${i}">
            <span>
              <strong>${DAYS[i]}</strong>
              <small>${esc(w.name)}</small>
            </span>
            <small>${w.minutes} min</small>
          </button>
        `).join("")}
      </div>
    </section>
  `;

  document.getElementById("start")
    .addEventListener("click",startWorkout);

  const resume=document.getElementById("resume");
  if(resume) resume.addEventListener("click",resumeWorkout);

  main.querySelectorAll("[data-day]").forEach(b=>{
    b.addEventListener("click",()=>{
      day=Number(b.dataset.day);
      renderToday();
      window.scrollTo(0,0);
    });
  });
}

function startWorkout() {
  if(db.draft &&
     !confirm("Replace your unfinished workout?")) {
    return;
  }

  session={
    day,
    startedAt:new Date().toISOString(),
    sets:setsFor(day)
  };

  db.draft=session;

  if(!save()) {
    session=null;
    return;
  }

  renderSession();
  window.scrollTo(0,0);
}

function validDraft(d) {
  if(!d || !Number.isInteger(d.day) ||
     !PLAN[d.day] || !Array.isArray(d.sets)) {
    return false;
  }

  return d.sets.length===PLAN[d.day].exercises.length &&
    d.sets.every((sets,i)=>
      Array.isArray(sets) &&
      sets.length===PLAN[d.day].exercises[i].reps.length &&
      sets.every(s=>s &&
        Number.isFinite(Number(s.reps)) &&
        Number.isFinite(Number(s.weight)))
    );
}

function resumeWorkout() {
  if(!validDraft(db.draft)) {
    alert("Saved workout cannot be resumed.");
    return;
  }

  session=db.draft;
  day=session.day;
  renderSession();
  window.scrollTo(0,0);
}

function stats() {
  const all=session.sets.flat();
  return {
    done:all.filter(s=>s.done).length,
    total:all.length
  };
}

function updateProgress() {
  const s=stats();
  const percent=s.total
    ?Math.round(s.done/s.total*100)
    :0;

  document.getElementById("progressText").textContent=
    `${s.done} of ${s.total} sets complete · ${percent}%`;

  document.getElementById("progressFill")
    .style.width=percent+"%";
}

function renderSession() {
  const w=PLAN[session.day];

  main.innerHTML=`
    ${hero(session.day)}

    <div class="equipment" id="equipment">
      <strong>Today's Equipment:</strong>
      ${esc(equipment(session.day,session.sets))}
    </div>

    <div class="panel">
      <div class="small" id="progressText"></div>
      <div class="progress-track">
        <div class="progress-fill"
          id="progressFill"></div>
      </div>
    </div>

    <div class="cards">
      ${w.exercises.map((e,i)=>
        card(e,session.sets[i],i,true)
      ).join("")}
    </div>

    <div class="actions">
      <button class="btn" id="finish">
        Finish Workout ✓
      </button>
      <button class="btn secondary" id="saveExit">
        Save & Exit
      </button>
    </div>
  `;

  updateProgress();

  main.querySelectorAll(".set-box[data-ex]")
    .forEach(b=>{
      b.addEventListener("click",()=>{
        const i=Number(b.dataset.ex);
        const j=Number(b.dataset.set);
        const s=session.sets[i][j];

        s.done=!s.done;
        b.classList.toggle("complete",s.done);
        b.setAttribute(
          "aria-pressed",s.done?"true":"false"
        );

        db.draft=session;
        save();
        updateProgress();
      });
    });

  main.querySelectorAll("input[data-edit-ex]")
    .forEach(input=>{
      input.addEventListener("change",()=>{
        const i=Number(input.dataset.editEx);
        const j=Number(input.dataset.editSet);
        const field=input.dataset.field;
        const n=Number(input.value);

        if(!Number.isInteger(n) || n<0 || n>999) {
          alert("Enter a valid whole number.");
          input.value=session.sets[i][j][field];
          return;
        }

        session.sets[i][j][field]=n;
        db.draft=session;
        save();

        const box=input.closest(".exercise")
          .querySelectorAll(".set-box")[j];

        if(field==="reps") {
          const unit=w.exercises[i].unit;
          box.querySelector(".reps").textContent=
            n+" "+unit;
        } else {
          const weight=box.querySelector(".weight");
          if(weight) weight.textContent=n+" lb";
        }

        document.getElementById("equipment").innerHTML=
          "<strong>Today's Equipment:</strong> "+
          esc(equipment(session.day,session.sets));
      });
    });

  document.getElementById("finish")
    .addEventListener("click",finishWorkout);

  document.getElementById("saveExit")
    .addEventListener("click",()=>{
      db.draft=session;
      if(!save()) return;
      session=null;
      renderToday();
      window.scrollTo(0,0);
    });
}

function finishWorkout() {
  const s=stats();

  if(!s.done) {
    alert("Mark at least one set complete.");
    return;
  }

  if(!confirm("Finish and save your workout?")) {
    return;
  }

  const d=session.day;

  const record={
    id:"forme-"+Date.now()+"-"+
      Math.random().toString(36).slice(2,7),
    date:new Date().toISOString(),
    name:PLAN[d].name,
    completed:s.done,
    total:s.total,
    details:PLAN[d].exercises.map((e,i)=>({
      name:e.name,
      unit:e.unit,
      sets:session.sets[i].map(x=>({...x}))
    }))
  };

  db.history.push(record);

  session.sets.forEach((sets,i)=>{
    if(sets.every(x=>x.done)) {
      db.weights[d+"-"+i]=sets.map(x=>x.weight);
    }
  });

  db.draft=null;

  if(!save()) {
    db.history.pop();
    db.draft=session;
    return;
  }

  session=null;
  renderProgress();
  window.scrollTo(0,0);
}

function renderProgress() {
  tab="progress";
  nav();

  const history=[...db.history].reverse();

  main.innerHTML=`
    <div class="hero">
      <h1>Your Progress</h1>
      <div class="meta">
        <span>${db.history.length} workouts</span>
      </div>
    </div>

    <div class="panel">
      <h3>Workout History</h3>

      ${history.length
        ?history.map(x=>`
          <div class="history-item">
            <div class="history-top">
              <strong>${esc(x.name||"Workout")}</strong>
              <button class="delete"
                data-delete="${esc(x.id)}">
                Delete
              </button>
            </div>
            <p class="small">
              ${x.date &&
                !Number.isNaN(new Date(x.date).getTime())
                ?new Date(x.date).toLocaleDateString()
                :"Previous workout"}
              · ${Number(x.completed)||0}
              / ${Number(x.total)||0} recorded sets
            </p>

            ${Array.isArray(x.details)?`
              <details>
                <summary>View sets and weights</summary>
                ${x.details.map(e=>`
                  <p class="small">
                    <strong>${esc(e.name)}</strong>
                    ${Array.isArray(e.sets)
                      ?e.sets.map((s,i)=>`
                        <br>
                        Set ${i+1}:
                        ${esc(s.reps)}
                        ${esc(e.unit||"reps")}
                        ${Number(s.weight)>0
                          ?" · "+esc(s.weight)+" lb"
                          :""}
                        ${s.done?" ✓":""}
                      `).join("")
                      :""}
                  </p>
                `).join("")}
              </details>`:""}
          </div>
        `).join("")
        :`<p class="small">
          Your completed workouts appear here.
        </p>`}
    </div>

    <div class="panel">
      <h3>Your Weight Progression</h3>
      <p class="small">
        Forme remembers the weights you used when
        every set of an exercise was completed.
        You can adjust weights in future sessions.
      </p>
    </div>

    <p class="small">
      Your history is saved in this browser
      on this device.
    </p>
  `;

  main.querySelectorAll("[data-delete]")
    .forEach(b=>{
      b.addEventListener("click",()=>{
        if(!confirm("Delete this workout?")) return;

        db.history=db.history.filter(
          x=>String(x.id)!==b.dataset.delete
        );
        save();
        renderProgress();
      });
    });
}

document.getElementById("todayNav")
  .addEventListener("click",()=>{
    renderToday();
    window.scrollTo(0,0);
  });

document.getElementById("progressNav")
  .addEventListener("click",()=>{
    renderProgress();
    window.scrollTo(0,0);
  });

renderToday();
</script>
</body>
</html>
