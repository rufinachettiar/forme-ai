

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f8f6f0">
<title>Forme AI</title>
<style>
:root{
  --bg:#f8f6f0;--paper:#fffefa;--green:#243d32;
  --sage:#bfd1b8;--muted:#758077;--line:#e7e8df;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--green);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,Arial,sans-serif;
}
button,input,select{font:inherit}
button{cursor:pointer}
.shell{max-width:1000px;margin:auto;padding:20px 16px 80px}
header{display:flex;justify-content:space-between;align-items:center;
  padding:10px 0 22px;border-bottom:1px solid var(--line)}
.logo{font:36px Georgia,serif;letter-spacing:-2px}
.logo small{font:12px Arial;letter-spacing:0;margin-left:5px}
.muted{color:var(--muted)}
nav{display:flex;gap:8px;overflow-x:auto;padding:18px 0}
nav button,.day{
  border:1px solid var(--line);border-radius:25px;
  background:var(--paper);color:var(--green);padding:10px 15px;
  white-space:nowrap
}
nav button.active,.day.active{background:var(--green);color:white}
h1,h2,h3{font-family:Georgia,serif;font-weight:400}
h1{font-size:clamp(30px,5vw,46px);line-height:1.1;margin:7px 0}
h2{font-size:25px}
h3{font-size:19px}
.eyebrow{color:#738d73;letter-spacing:2px;font-size:11px;
  font-weight:700;margin-top:24px}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin:17px 0}
.pill{background:#edf0e8;border-radius:30px;padding:7px 12px;
  color:#57705a;font-size:12px}
.card{background:var(--paper);border:1px solid var(--line);
  border-radius:17px;overflow:hidden;margin:12px 0}
.exercise{display:grid;grid-template-columns:145px 1fr auto;
  align-items:center;min-height:120px}
.exercise img{width:145px;height:120px;object-fit:cover;
  background:#eee9e2}
.exname{padding:12px}
.exname h3{margin:0 0 5px}
.exname small{color:var(--muted)}
.setarea{padding:10px 14px}
.setarea label{display:block;font-size:10px;letter-spacing:1px;
  color:var(--muted);margin-bottom:7px;text-align:right}
.sets{display:flex;gap:6px}
.set{
  min-width:65px;padding:9px 5px;border-radius:10px;
  background:#f4f3ed;border:1px solid #e4e7dc;color:var(--green)
}
.set strong,.set small{display:block}
.set small{font-size:10px;color:var(--muted)}
.set.done{background:var(--sage);border-color:#90ae8a}
.track{height:8px;border-radius:20px;background:#e3e9e0;overflow:hidden}
.fill{height:100%;background:#83a080}
.days{display:flex;gap:7px;overflow-x:auto;margin:18px 0}
.day{border-radius:13px;min-width:72px;padding:9px}
.primary,.secondary{
  border-radius:12px;padding:12px 17px;margin:5px 5px 5px 0;
  border:1px solid var(--green)
}
.primary{background:var(--green);color:white}
.secondary{background:var(--paper);color:var(--green)}
.panel{padding:19px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.stat{padding:18px}
.stat strong{font:30px Georgia,serif;display:block}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;color:var(--muted)}
.field input,.field select{
  width:100%;border:1px solid #dfe5db;border-radius:9px;
  padding:10px;background:white;color:var(--green)
}
.formgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.library{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.library img{width:100%;height:135px;object-fit:cover}
.library .caption{padding:10px}
.historyrow{padding:13px 0;border-bottom:1px solid var(--line)}
.note{background:#eff2e9;border-left:3px solid #9bb49a;
  padding:13px;border-radius:5px;margin:15px 0}
dialog{border:0;border-radius:17px;padding:22px;width:min(450px,95vw);
  max-height:85vh;overflow:auto;background:var(--paper);color:var(--green)}
dialog::backdrop{background:#15291ab0}
footer{text-align:center;color:#a0aaa0;margin-top:45px;font-size:12px}
@media(max-width:750px){
  .exercise{grid-template-columns:110px minmax(0,1fr)}
  .exercise img{width:110px;height:100%;min-height:125px}
  .exname{padding:10px 10px 2px}
  .exname h3{font-size:17px}
  .exname small{display:none}
  .setarea{grid-column:2;padding:3px 10px 10px}
  .setarea label{text-align:left}
  .set{min-width:57px;padding:7px 4px}
  .library{grid-template-columns:repeat(2,1fr)}
  .formgrid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<div class="shell">
<header>
  <div class="logo">forme.<small>ai</small></div>
  <span class="muted" id="dateLabel">Your strength coach</span>
</header>
<nav id="nav">
  <button data-tab="today" class="active">Today's Workout</button>
  <button data-tab="plan">12-Week Plan</button>
  <button data-tab="progress">My Progress</button>
  <button data-tab="history">History</button>
  <button data-tab="library">Exercises</button>
</nav>
<main id="app"></main>
<footer>forme. ai · Stronger, one session at a time</footer>
</div>
<dialog id="editor"></dialog>

<script>
"use strict";

// Each exercise has a stable ID and an image in /media/.
const E = {};
function add(id,name,group,weights,reps,cue,extra={}){
  E[id]={id,name,group,weights,reps,cue,
    image:extra.image||id+".jpg",
    equipment:extra.equipment||(
      weights.some(w=>w>0)?"Dumbbells":"Mat"
    )};
}

add("goblet-squat","Goblet Squat","Lower",
 [10,15,15],["15","12","10"],"Hold dumbbell at chest; squat with control.");
add("floor-press","Dumbbell Floor Press","Chest",
 [5,8,10],["12","10","8"],"Keep elbows about 45 degrees from your torso.");
add("bent-over-row","Bent-over Dumbbell Row","Back",
 [8,10,10],["15","12","10"],"Hinge at hips and row toward your waist.");
add("romanian-deadlift","Romanian Deadlift","Lower",
 [10,15,15],["15","12","10"],"Keep weights close to legs; hinge at hips.");
add("dead-bug","Dead Bug","Core",
 [0,0],["8/side","8/side"],"Keep back supported on the mat.");

add("floor-fly","Dumbbell Floor Fly","Chest",
 [5,5],["12","12"],"Soft elbows; lower in a controlled arc.");
add("seated-shoulder-press","Seated Shoulder Press","Shoulders",
 [5,5,8],["12","10","8"],"Press overhead without arching back.",
 {equipment:"Dumbbells · Stable chair"});
add("lateral-raise","Lateral Raise","Shoulders",
 [5,5],["12","12"],"Raise arms to shoulder height without swinging.");
add("front-raise","Front Raise","Shoulders",
 [5,5],["12","10"],"Lift forward with soft elbows.");
add("biceps-curl","Biceps Curl","Arms",
 [5,8,8],["15","12","10"],"Keep elbows beside torso.");
add("hammer-curl","Hammer Curl","Arms",
 [5,8],["12","10"],"Keep palms facing inward.");
add("curl-to-press","Curl to Shoulder Press","Arms",
 [5,5],["10","10"],"Curl to shoulders, then press overhead.");
add("arnold-press","Arnold Press","Shoulders",
 [5,5],["10","10"],"Rotate palms as you press upward.");
add("around-the-world","Around the World","Shoulders",
 [5,5],["10","10"],"Use a light weight and controlled shoulder arc.");
add("overhead-triceps-extension","Overhead Triceps Extension","Arms",
 [5,8],["12","10"],"Keep elbows pointing upward.");
add("triceps-kickback","Triceps Kickback","Arms",
 [5,5],["12","12"],"Hold upper arm still; extend elbow.");
add("push-up","Push-up","Chest",
 [0,0],["8","8"],"Keep body aligned; modify at knees if needed.");
add("incline-push-up","Incline Push-up","Chest",
 [0,0],["10","10"],"Use a stable elevated surface.");
add("incline-chest-press","Incline Chest Press","Chest",
 [5,8],["12","10"],"Requires a stable adjustable bench.",
 {equipment:"Dumbbells · Incline bench"});
add("decline-push-up","Decline Push-up","Chest",
 [0,0],["8","8"],"Use a stable platform for feet.",
 {equipment:"Stable platform"});
add("close-grip-push-up","Close-grip Push-up","Arms",
 [0,0],["8","8"],"Keep elbows close to torso.");
add("one-arm-row","One-arm Dumbbell Row","Back",
 [8,10,10],["12/side","10/side","10/side"],
 "Support free hand on stable surface.");
add("renegade-row","Renegade Row","Back",
 [5,5],["8/side","8/side"],"Keep hips steady.");

add("sumo-squat","Sumo Squat","Lower",
 [10,15,15],["15","12","10"],"Take a wider stance.");
add("reverse-lunge","Reverse Lunge","Lower",
 [0,5,8],["12/side","10/side","8/side"],"Step backward with control.");
add("forward-lunge","Forward Lunge","Lower",
 [0,5],["12/side","10/side"],"Keep front knee aligned.");
add("bulgarian-split-squat","Bulgarian Split Squat","Lower",
 [0,5],["10/side","8/side"],"Use a stable low rear-foot support.");
add("step-up","Step-up","Lower",
 [0,5],["10/side","10/side"],"Use a sturdy step.");
add("lateral-lunge","Lateral Lunge","Lower",
 [0,5],["10/side","10/side"],"Shift hips back over working leg.");
add("single-leg-rdl","Single-leg Romanian Deadlift","Lower",
 [0,5],["10/side","10/side"],"Keep hips level.");
add("deadlift","Dumbbell Deadlift","Lower",
 [10,15,15],["15","12","10"],"Push through feet and stand tall.");
add("hip-thrust","Hip Thrust","Glutes",
 [0,10,15],["15","12","10"],"Support upper back on stable surface.");
add("glute-bridge","Glute Bridge","Glutes",
 [0,0,0],["15","15","12"],"Squeeze glutes at top.");
add("frog-pump","Frog Pump","Glutes",
 [0,0],["15","15"],"Soles together, knees outward, lift hips.");
add("donkey-kick","Donkey Kick","Glutes",
 [0,0],["12/side","12/side"],"Lift bent knee without arching back.");
add("clamshell","Clamshell","Glutes",
 [0,0],["15/side","15/side"],"Feet together, raise upper knee.");
add("glute-kickback","Glute Kickback","Glutes",
 [0,0],["12/side","12/side"],"Extend leg behind with control.");
add("wall-sit","Wall Sit","Lower",
 [0,0],["30s","40s"],"Keep back against wall.");

add("plank","Plank","Core",
 [0,0],["25s","35s"],"Maintain a straight body line.");
add("forearm-plank","Forearm Plank","Core",
 [0,0],["25s","35s"],"Keep hips level.");
add("side-plank","Side Plank","Core",
 [0,0],["20s/side","25s/side"],"Keep shoulders stacked.");
add("russian-twist","Russian Twist","Core",
 [0,0],["20 total","20 total"],"Rotate torso slowly.");
add("bicycle-crunch","Bicycle Crunch","Core",
 [0,0],["20 total","20 total"],"Rotate from torso, not neck.");
add("leg-raise","Leg Raise","Core",
 [0,0],["10","10"],"Lower only as far as back stays stable.");
add("hollow-hold","Hollow Hold","Core",
 [0,0],["15s","20s"],"Keep lower back gently pressed down.");
add("mountain-climber","Mountain Climber","Cardio",
 [0,0],["20 total","30 total"],"Keep shoulders over hands.");
add("burpee","Burpee","Cardio",
 [0,0],["8","8"],"Step back instead of jumping if needed.");
add("high-knees","High Knees","Cardio",
 [0,0],["30s","30s"],"March or jog in place.");

add("squat-pulse","Squat Pulse","Lower",
 [0,0],["15","15"],"Small controlled pulses.");
add("single-leg-bridge","Single-leg Bridge","Glutes",
 [0,0],["10/side","10/side"],"Keep pelvis level.");

// Weekly structure, with upper body from Week 1.
const DAYS=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];

const PHASES=[
[
 ["Full Body Strength A",
  ["goblet-squat","floor-press","bent-over-row",
   "romanian-deadlift","dead-bug"]],
 ["Chest, Shoulders & Arms",
  ["floor-press","floor-fly","seated-shoulder-press",
   "lateral-raise","hammer-curl","overhead-triceps-extension"]],
 ["Lower Body & Glutes",
  ["sumo-squat","reverse-lunge","romanian-deadlift",
   "glute-bridge","donkey-kick"]],
 ["Core & Recovery",
  ["dead-bug","bird-dog","side-plank","clamshell"]],
 ["Full Body Strength B",
  ["goblet-squat","one-arm-row","floor-press",
   "reverse-lunge","plank"]],
 ["Arms, Glutes & Core",
  ["biceps-curl","front-raise","triceps-kickback",
   "frog-pump","bicycle-crunch"]],
 ["Walking & Mobility",["walk","stretch"]]
],
[
 ["Full Body Progressive",
  ["goblet-squat","floor-press","one-arm-row",
   "single-leg-rdl","dead-bug"]],
 ["Chest, Shoulders & Arms",
  ["floor-press","floor-fly","arnold-press",
   "lateral-raise","hammer-curl","overhead-triceps-extension"]],
 ["Glutes & Legs",
  ["bulgarian-split-squat","sumo-squat","hip-thrust",
   "lateral-lunge","clamshell"]],
 ["Core & Recovery",
  ["forearm-plank","dead-bug","side-plank","walk"]],
 ["Full Body Progressive B",
  ["deadlift","curl-to-press","bent-over-row",
   "step-up","mountain-climber"]],
 ["Arms & Glutes",
  ["biceps-curl","around-the-world","triceps-kickback",
   "single-leg-bridge","russian-twist"]],
 ["Walking & Mobility",["walk","stretch"]]
],
[
 ["Full Body Strength",
  ["goblet-squat","single-leg-rdl","floor-press",
   "renegade-row","hollow-hold"]],
 ["Chest, Shoulders & Arms",
  ["floor-press","floor-fly","arnold-press",
   "lateral-raise","curl-to-press","overhead-triceps-extension"]],
 ["Legs & Glutes",
  ["bulgarian-split-squat","step-up","deadlift",
   "hip-thrust","frog-pump"]],
 ["Core & Recovery",
  ["dead-bug","side-plank","clamshell","walk"]],
 ["Full Body Strength B",
  ["sumo-squat","one-arm-row","push-up",
   "lateral-lunge","mountain-climber"]],
 ["Arms & Core",
  ["hammer-curl","front-raise","triceps-kickback",
   "bicycle-crunch","leg-raise"]],
 ["Walking & Mobility",["walk","stretch"]]
]
];

// Low-impact exercises with no external equipment.
add("walk","Indoor Walk","Recovery",
 [0],["20min"],"Walk at a comfortable pace.",
 {equipment:"None",image:"high-knees.jpg"});
add("stretch","Gentle Stretch","Recovery",
 [0],["5min"],"Move slowly and breathe.",
 {equipment:"Mat",image:"clamshell.jpg"});
add("bird-dog","Bird Dog","Core",
 [0,0],["8/side","8/side"],"Reach opposite arm and leg.",
 {image:"donkey-kick.jpg"});

// Data lives in browser localStorage.
const KEY="forme_ai_complete_v1";
const BASELINE={
 date:"2026-11-16",weight:155.2,chest:38,waist:31.5,
 hips:43,arms:14,thighs:23.2,belowBust:31.5
};

function initial(){
 return {
  tab:"today",week:1,day:(new Date().getDay()+6)%7,
  drafts:{},logs:[],measurements:[BASELINE]
 };
}
let state;
try{
 state=JSON.parse(localStorage.getItem(KEY))||initial();
}catch(e){state=initial();}
if(!state.drafts)state.drafts={};
if(!state.logs)state.logs=[];
if(!state.measurements?.length)state.measurements=[BASELINE];

function save(){localStorage.setItem(KEY,JSON.stringify(state));}
function el(id){return document.getElementById(id);}
function esc(s){
 return String(s).replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",
  '"':"&quot;","'":"&#39;"
 })[c]);
}
function dateToday(){
 const d=new Date();
 return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")
  +"-"+String(d.getDate()).padStart(2,"0");
}
function phase(){return Math.min(2,Math.floor((state.week-1)/4));}
function plan(day=state.day){
 const p=PHASES[phase()][day];
 return {title:p[0],ids:p[1]};
}
function draftKey(){return state.week+"-"+state.day;}
function getDraft(){
 const k=draftKey(),p=plan();
 if(!state.drafts[k]){
  state.drafts[k]=p.ids.map(id=>({
   id,sets:E[id].reps.map((r,i)=>({
    reps:r,weight:E[id].weights[i]||0,done:false
   }))
  }));
  save();
 }
 return state.drafts[k];
}
function counts(){
 const items=getDraft();
 return {
  done:items.reduce((n,x)=>n+x.sets.filter(s=>s.done).length,0),
  total:items.reduce((n,x)=>n+x.sets.length,0)
 };
}
function img(id){
 return "media/"+encodeURIComponent(E[id].image);
}
function photo(id){
 return '<img src="'+img(id)+'" alt="'+esc(E[id].name)+
 '" loading="lazy" onerror="this.onerror=null;this.style.opacity=.3">';
}
function heading(k,t){
 return '<div class="eyebrow">'+k+'</div><h1>'+t+'</h1>';
}
function equipment(){
 const items=getDraft();
 const weights=new Set(),other=new Set();
 items.forEach(item=>{
  const e=E[item.id];
  item.sets.forEach(s=>{if(s.weight>0)weights.add(s.weight);});
  if(e.equipment.includes("Mat"))other.add("Mat");
  if(e.equipment.includes("chair"))other.add("Stable chair");
 });
 return [...[...weights].sort((a,b)=>a-b).map(x=>x+" lb"),
  ...other].join(" · ")||"Bodyweight";
}
function today(){
 const p=plan(),c=counts(),items=getDraft();
 let out=heading("YOUR DAILY STRENGTH SESSION",p.title);
 out+='<p class="muted">Week '+state.week+
  ' · Phase '+(phase()+1)+' · Your personal workout</p>';
 out+='<div class="pills"><span class="pill">Strength & movement</span>'+
  '<span class="pill">'+equipment()+'</span></div>';
 out+='<div class="days">';
 DAYS.forEach((d,i)=>{
  out+='<button class="day '+(state.day===i?"active":"")+
   '" data-day="'+i+'">'+d+'</button>';
 });
 out+='</div>';
 out+='<div class="track"><div class="fill" style="width:'+
  (c.total?100*c.done/c.total:0)+'%"></div></div>';
 out+='<p class="muted">'+c.done+' of '+c.total+' sets completed</p>';
 items.forEach((item,i)=>{
  const e=E[item.id];
  out+='<article class="card exercise">'+photo(item.id)+
   '<div class="exname"><h3>'+esc(e.name)+'</h3>'+
   '<small>'+esc(e.cue)+'</small></div>'+
   '<div class="setarea"><label>SETS · TAP TO COMPLETE</label>'+
   '<div class="sets">';
  item.sets.forEach((s,j)=>{
   out+='<button class="set '+(s.done?"done":"")+
    '" data-set="'+i+':'+j+'"><strong>'+esc(s.reps)+
    '</strong><small>'+(s.weight?s.weight+" lb":"BW")+
    '</small></button>';
  });
  out+='</div></div></article>';
 });
 out+='<div class="card panel"><h3>Equipment for today</h3>'+
  '<p>'+esc(equipment())+'</p></div>';
 out+='<button class="secondary" id="edit">Edit Reps & Weights</button>'+
  '<button class="primary" id="finish">Finish & Save Workout</button>'+
  '<button class="secondary" id="reset">Reset Checkmarks</button>';
 out+='<div class="note">Start with weights you can control. '+
  'Leave approximately 1–3 good repetitions in reserve. '+
  'Rest as needed between sets.</div>';
 return out;
}
function planPage(){
 let out=heading("YOUR TRAINING ROADMAP","12-Week Plan");
 out+='<div class="card panel"><h3>Choose your week</h3>'+
  '<select id="weekSelect">';
 for(let w=1;w<=12;w++){
  out+='<option value="'+w+'" '+(w===state.week?"selected":"")+
   '>Week '+w+'</option>';
 }
 out+='</select><p class="muted">Phase '+(phase()+1)+
  ': '+["Foundation","Progressive Strength",
       "Strength & Definition"][phase()]+'</p></div>';
 DAYS.forEach((d,i)=>{
  const p=plan(i);
  out+='<div class="card panel"><h3>'+d+' · '+p.title+'</h3>'+
   '<p class="muted">'+p.ids.map(id=>E[id].name).join(" · ")+
   '</p><button class="secondary" data-open="'+i+
   '">Open Workout</button></div>';
 });
 return out;
}
function progressPage(){
 const a=state.measurements[0];
 const m=state.measurements[state.measurements.length-1];
 let out=heading("YOUR STARTING POINT","My Progress");
 out+='<div class="grid"><div class="card stat"><span class="muted">'+
  'Latest weight</span><strong>'+m.weight+' lb</strong></div>'+
  '<div class="card stat"><span class="muted">Saved workouts</span>'+
  '<strong>'+state.logs.length+'</strong></div></div>';
 out+='<div class="card panel"><h2>Body Measurements</h2>'+
  '<p class="muted">Baseline: November 16, 2026</p><div class="grid">';
 const fields=[
  ["chest","Chest"],["waist","Waist"],["hips","Hips"],
  ["arms","Arms"],["thighs","Thighs"],["belowBust","Below bust"]
 ];
 fields.forEach(([k,label])=>{
  const diff=(Number(m[k])-Number(a[k])).toFixed(1);
  out+='<div><span class="muted">'+label+'</span>'+
   '<div style="font:27px Georgia,serif">'+m[k]+' in</div>'+
   '<small class="muted">Change: '+(diff>0?"+":"")+diff+
   ' in</small></div>';
 });
 out+='</div></div>';
 out+='<div class="card panel"><h2>New Measurement Check-in</h2>'+
  '<form id="measureForm"><div class="formgrid">';
 [["date","Date"],["weight","Weight (lb)"],...fields.map(
  ([k,v])=>[k,v+" (in)"]
 )].forEach(([k,label])=>{
  out+='<div class="field"><label>'+label+'</label>'+
   '<input name="'+k+'" type="'+(k==="date"?"date":"number")+
   '" '+(k==="date"?'':'step="0.1" min="0.1"')+
   ' value="'+(k==="date"?dateToday():m[k])+
   '" required></div>';
 });
 out+='</div><p><button class="primary" type="submit">'+
  'Save Measurements</button></p></form></div>';
 out+='<div class="card panel"><h2>Check-in History</h2>';
 state.measurements.slice().reverse().forEach(x=>{
  out+='<div class="historyrow"><strong>'+esc(x.date)+'</strong>'+
   '<p class="muted">'+x.weight+' lb · Waist '+x.waist+
   ' in · Hips '+x.hips+' in</p></div>';
 });
 return out+'</div>';
}
function historyPage(){
 let out=heading("EVERY SESSION COUNTS","Workout History");
 out+='<div class="card panel">';
 if(!state.logs.length){
  out+='<p class="muted">No completed sessions yet.</p>';
 }
 state.logs.slice().reverse().forEach(x=>{
  out+='<div class="historyrow"><strong>'+esc(x.title)+'</strong>'+
   '<p class="muted">'+esc(x.date)+' · '+x.completed+
   '/'+x.total+' sets · Week '+x.week+'</p></div>';
 });
 out+='</div><button class="secondary" id="export">'+
  'Export Data Backup</button>';
 out+='<p class="muted">Data is stored locally in this browser. '+
  'Export regularly to keep a backup.</p>';
 return out;
}
function libraryPage(){
 let out=heading("YOUR MOVEMENT COLLECTION","Exercise Library");
 out+='<div class="card panel"><input id="search" '+
  'placeholder="Search exercises..." style="width:100%;padding:12px">'+
  '</div><div class="library" id="tiles"></div>';
 return out;
}
function drawTiles(q=""){
 el("tiles").innerHTML=Object.values(E)
  .filter(e=>(e.name+" "+e.group).toLowerCase().includes(q.toLowerCase()))
  .map(e=>'<div class="card">'+photo(e.id)+
   '<div class="caption"><strong>'+esc(e.name)+'</strong>'+
   '<div class="muted">'+esc(e.group)+'</div></div></div>').join("");
}
function render(){
 document.querySelectorAll("[data-tab]").forEach(b=>
  b.classList.toggle("active",b.dataset.tab===state.tab));
 const pages={
  today,plan:planPage,progress:progressPage,
  history:historyPage,library:libraryPage
 };
 el("app").innerHTML=(pages[state.tab]||today)();
 bind();
}
function bind(){
 document.querySelectorAll("[data-day]").forEach(b=>{
  b.onclick=()=>{state.day=+b.dataset.day;save();render();};
 });
 document.querySelectorAll("[data-open]").forEach(b=>{
  b.onclick=()=>{state.day=+b.dataset.open;state.tab="today";
   save();render();window.scrollTo(0,0);};
 });
 document.querySelectorAll("[data-set]").forEach(b=>{
  b.onclick=()=>{
   const [i,j]=b.dataset.set.split(":").map(Number);
   const s=getDraft()[i].sets[j];
   s.done=!s.done;save();render();
  };
 });
 if(el("weekSelect"))el("weekSelect").onchange=e=>{
  state.week=+e.target.value;save();render();
 };
 if(el("finish"))el("finish").onclick=()=>{
  const c=counts();
  if(!c.done)return alert("Complete at least one set first.");
  state.logs.push({
   date:dateToday(),week:state.week,day:state.day,
   title:plan().title,completed:c.done,total:c.total,
   items:JSON.parse(JSON.stringify(getDraft()))
  });
  delete state.drafts[draftKey()];
  save();render();alert("Workout saved!");
 };
 if(el("reset"))el("reset").onclick=()=>{
  if(confirm("Reset checkmarks for this workout?")){
   getDraft().forEach(x=>x.sets.forEach(s=>s.done=false));
   save();render();
  }
 };
 if(el("edit"))el("edit").onclick=openEditor;
 if(el("search")){
  drawTiles();
  el("search").oninput=e=>drawTiles(e.target.value);
 }
 if(el("measureForm"))el("measureForm").onsubmit=e=>{
  e.preventDefault();
  const m={};
  new FormData(e.target).forEach((v,k)=>{
   m[k]=k==="date"?v:Number(v);
  });
  state.measurements.push(m);
  state.measurements.sort((a,b)=>a.date.localeCompare(b.date));
  save();render();alert("Measurements saved!");
 };
 if(el("export"))el("export").onclick=()=>{
  const blob=new Blob([JSON.stringify(state,null,2)],
   {type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="forme-ai-backup-"+dateToday()+".json";
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
 };
}
function openEditor(){
 const dlg=el("editor");
 const items=getDraft();
 let html='<h2>Edit Workout Sets</h2><form id="editForm">';
 items.forEach((item,i)=>{
  html+='<h3>'+esc(E[item.id].name)+'</h3><div class="formgrid">';
  item.sets.forEach((s,j)=>{
   html+='<div class="field"><label>Set '+(j+1)+' reps</label>'+
    '<input name="r'+i+'_'+j+'" value="'+esc(s.reps)+
    '" required></div>'+
    '<div class="field"><label>Weight (lb)</label>'+
    '<input name="w'+i+'_'+j+'" type="number" min="0" '+
    'step="0.5" value="'+s.weight+'" required></div>';
  });
  html+='</div>';
 });
 html+='<p><button class="primary" type="submit">Save Changes</button>'+
  '<button class="secondary" type="button" id="cancelEdit">'+
  'Cancel</button></p></form>';
 dlg.innerHTML=html;
 dlg.showModal();
 el("cancelEdit").onclick=()=>dlg.close();
 el("editForm").onsubmit=e=>{
  e.preventDefault();
  const f=new FormData(e.target);
  items.forEach((item,i)=>item.sets.forEach((s,j)=>{
   s.reps=String(f.get("r"+i+"_"+j)).trim();
   s.weight=Number(f.get("w"+i+"_"+j));
  }));
  save();dlg.close();render();
 };
}
document.querySelectorAll("[data-tab]").forEach(b=>{
 b.onclick=()=>{
  state.tab=b.dataset.tab;
  save();render();window.scrollTo(0,0);
 };
});
el("dateLabel").textContent=new Date().toLocaleDateString(
 "en-US",{month:"short",day:"numeric",year:"numeric"});
render();
</script>
</body>
</html>
