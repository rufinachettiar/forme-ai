
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F8F5EF">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Forme AI V0.3</title>
<style>
:root{
 --bg:#f8f5ef;--ink:#28342c;--sage:#718b76;
 --pale:#eaf0e8;--line:#e1e6df;--muted:#758078
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
font:15px -apple-system,BlinkMacSystemFont,sans-serif}
header,main{max-width:600px;margin:auto}
header{padding:24px 20px 5px}
main{padding:12px 18px 115px}
.logo{font:34px Georgia,serif}
.logo span{color:var(--sage)}
h1{font:normal 30px Georgia,serif;margin:12px 0 18px}
h2{font-size:18px;margin:0 0 12px}
h3{font-size:16px;margin:0 0 8px}
p{line-height:1.5}
.muted{font-size:13px;color:var(--muted)}
.eyebrow{font-size:11px;letter-spacing:1.3px;
font-weight:700;color:var(--sage)}
.card{background:white;border:1px solid var(--line);
border-radius:19px;padding:18px;margin-bottom:14px}
.hero{background:var(--pale)}
.row{display:flex;justify-content:space-between;
align-items:center;gap:10px}
.btn{border:0;border-radius:12px;background:var(--ink);
color:white;padding:13px 16px;min-height:44px;
font:600 14px -apple-system,sans-serif;cursor:pointer}
.btn:disabled{opacity:.4}
.wide{width:100%}
.outline{background:white;color:var(--ink);
border:1px solid var(--line)}
.small{font-size:12px;padding:8px 10px;min-height:34px}
.day{border-bottom:1px solid var(--line);padding:13px 0}
.day:last-child{border:0}
.day button{border:0;background:none;color:inherit;
text-align:left;font:inherit;flex:1}
.active{color:var(--sage);font-weight:700}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choice{border:1px solid var(--line);background:white;
padding:11px;border-radius:10px;font:inherit}
.choice.on{background:var(--sage);color:white}
input,select{border:1px solid #d3ddd3;border-radius:9px;
padding:9px;background:white;color:var(--ink);font:inherit}
input[type=number]{width:100%;min-width:0}
input[type=checkbox]{accent-color:var(--sage);
width:21px;height:21px}
.check{display:flex;gap:12px;align-items:center;
padding:12px 0}
.set{display:grid;grid-template-columns:30px 1fr 1fr 48px;
gap:8px;align-items:end;padding:10px 0;
border-bottom:1px solid var(--line)}
.set label{font-size:11px;color:var(--muted)}
.set button{min-height:42px;border-radius:9px;
border:1px solid var(--line);background:var(--pale)}
.set button.done{background:var(--sage);color:white}
.exercise{padding:16px 0;border-bottom:1px solid var(--line)}
.exercise:last-child{border:0}
.stat{font:32px Georgia,serif}
.note{background:var(--pale);border-radius:11px;
padding:12px;font-size:13px;line-height:1.5}
.hidden{display:none}
nav{position:fixed;bottom:0;left:0;right:0;
display:flex;background:white;border-top:1px solid var(--line);
padding:9px 8px calc(9px + env(safe-area-inset-bottom))}
nav button{flex:1;border:0;background:none;
font-size:12px;color:var(--muted);padding:11px 0}
nav button.on{color:var(--sage);font-weight:700}
</style>
</head>
<body>
<header>
<div class="logo">forme<span>.</span> ai</div>
<div class="eyebrow">PERSONAL STRENGTH STUDIO · V0.3</div>
</header>
<main>
<section id="today"></section>
<section id="coach" class="hidden"></section>
<section id="nutrition" class="hidden"></section>
<section id="progress" class="hidden"></section>
</main>
<nav>
<button class="on" onclick="tab('today')">Today</button>
<button onclick="tab('coach')">Coach</button>
<button onclick="tab('nutrition')">Nutrition</button>
<button onclick="tab('progress')">Progress</button>
</nav>
<script>
"use strict";

/*
 Exercise format:
 [name, rep targets, weights in pounds, equipment]
 Equipment: pair, one, none
 Weights for pair exercises are PER DUMBBELL.
 Initial loads are conservative estimates.
*/

const plan=[
{
name:"Full Body Strength A",minutes:40,
ex:[
["Goblet squat",[15,12,10],[10,15,15],"one"],
["Dumbbell floor press",[12,10,8],[5,8,10],"pair"],
["Bent-over dumbbell row",[15,12,10],[8,10,10],"pair"],
["Dumbbell Romanian deadlift",[15,12,10],[10,15,15],"pair"],
["Dead bug (per side)",[8,8],[0,0],"none"]
]},
{
name:"Indoor Walk + Core",minutes:30,
ex:[
["Indoor walking (minutes)",[20],[0],"none"],
["Dead bug (per side)",[8,8],[0,0],"none"],
["Bird dog (per side)",[8,8],[0,0],"none"]
]},
{
name:"Full Body Strength B",minutes:40,
ex:[
["Reverse lunge (per leg)",[12,10,8],[0,5,8],"pair"],
["Standing shoulder press",[15,12,10],[5,8,8],"pair"],
["Bent-over dumbbell row",[15,12,10],[8,10,10],"pair"],
["Floor glute bridge",[15,12,10],[0,0,0],"none"],
["Side plank (seconds/side)",[20,25],[0,0],"none"]
]},
{
name:"Recovery + Mobility",minutes:25,
ex:[
["Indoor walking (minutes)",[10],[0],"none"],
["Cat-cow",[8,8],[0,0],"none"],
["Hip mobility (minutes)",[5],[0],"none"],
["Gentle stretching (minutes)",[5],[0],"none"]
]},
{
name:"Full Body Circuit",minutes:40,
ex:[
["Squat to press",[12,10,8],[5,5,8],"pair"],
["Alternating reverse lunge (total)",[15,12,10],[0,5,5],"pair"],
["Dumbbell row (total)",[15,12,10],[8,10,10],"pair"],
["Bicycle crunch (total)",[20,20],[0,0],"none"],
["Wall sit (seconds)",[30,40],[0,0],"none"]
]},
{
name:"Glutes, Arms + Core",minutes:35,
ex:[
["Dumbbell sumo squat",[15,12,10],[10,15,15],"one"],
["Floor glute bridge",[15,12,10],[0,0,0],"none"],
["Dumbbell biceps curl",[15,12,10],[5,8,8],"pair"],
["Dumbbell lateral raise",[12,10,8],[5,5,5],"pair"],
["Bird dog (per side)",[8,8],[0,0],"none"]
]},
{
name:"Easy Walk + Stretch",minutes:25,
ex:[
["Indoor walking (minutes)",[20],[0],"none"],
["Gentle stretching (minutes)",[5],[0],"none"]
]}
];

const days=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const options=[0,5,8,10,15,20,25];
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,
c=>({"&":"&amp;","<":"&lt;",">":"&gt;",
'"':"&quot;","'":"&#39;"}[c]));

function read(key,fallback){
try{return JSON.parse(localStorage.getItem(key))??fallback}
catch{return fallback}
}
let db=read("forme_v03",null);
if(!db||typeof db!=="object")db={
history:[],weights:{},feedback:{},draft:null
};
db.history??=[];
db.weights??={};
db.feedback??={};
db.draft??=null;

function save(){
try{localStorage.setItem("forme_v03",JSON.stringify(db))}
catch{alert("Unable to save. Check browser storage.")}
}

/* Preserve old history; don't erase earlier keys. */
if(!db.migrated){
const v2=read("forme_v02",null);
if(v2&&Array.isArray(v2.history)){
db.history=v2.history.map((x,i)=>({
...x,id:"v2-"+i+"-"+String(x.id??"")
}));
if(v2.draft){
db.oldDraftNotice=true;
}
}else{
const v1=read("forme_logs",[]);
if(Array.isArray(v1)){
db.history=v1.map((x,i)=>({
...x,id:"v1-"+i,
legacy:true
}));
}
}
db.migrated=true;
save();
}

let day=(new Date().getDay()+6)%7;
let stage="home";
let ready={energy:3,soreness:2,time:40,pain:false};
let checks={};
let session=null;

function tab(t){
["today","coach","nutrition","progress"].forEach(x=>
$(x).classList.toggle("hidden",x!==t));
document.querySelectorAll("nav button").forEach((b,i)=>
b.classList.toggle("on",
["today","coach","nutrition","progress"][i]===t));
if(t==="progress")progress();
if(t==="coach")coach();
}
function choose(i){
day=i;stage="home";render();
}
function key(i){return day+"-"+i}
function base(i){
return plan[day].ex[i][2].slice();
}
function weights(i){
const k=key(i);
const a=db.weights[k];
return Array.isArray(a)&&
a.length===plan[day].ex[i][1].length
?a.slice():base(i);
}
function changeWeight(i,j,value){
let w=weights(i);
w[j]=Number(value);
db.weights[key(i)]=w;
save();
}
function recommendation(i){
const x=plan[day].ex[i];
const f=db.feedback[key(i)];
if(!f)return "Starting prescription";
if(f==="easy")return "Last time: easy. Consider a small increase next session.";
if(f==="right")return "Last time: just right. Repeat until consistent.";
if(f==="hard")return "Last time: hard. Keep or reduce the load.";
return "Last time: discomfort. Avoid the painful movement.";
}
function gear(){
const items=new Set(["Water bottle"]);
plan[day].ex.forEach((x,i)=>{
weights(i).forEach(n=>{
if(x[3]!=="none"&&n>0)
items.add(n+" lb dumbbell "+
(x[3]==="pair"?"pair":"(one)"));
});
if(/floor|dead bug|bird dog|plank|stretch|mobility|cat-cow|crunch|bridge/i.test(x[0]))
items.add("Yoga mat");
});
return [...items];
}
function render(){
const w=plan[day];
if(stage==="home"){
$("today").innerHTML=`
<div class="eyebrow">TRAIN WITH INTENTION</div>
<h1>Your strength, your pace.</h1>
${db.draft?`<div class="card hero">
<h2>Unfinished workout</h2>
<button class="btn wide" onclick="resume()">Resume workout</button>
</div>`:""}
${db.oldDraftNotice?`<div class="card">
<p class="muted">Your previous V0.2 unfinished session was not converted. Completed workout history was retained.</p>
<button class="btn outline small" onclick="db.oldDraftNotice=false;save();render()">Dismiss</button>
</div>`:""}
<div class="card hero">
<div class="eyebrow">SELECTED WORKOUT</div>
<h1>${esc(w.name)}</h1>
<p class="muted">${w.minutes} MIN · HOME STUDIO</p>
<button class="btn wide" onclick="stage='ready';render()">
Prepare workout →</button>
</div>
<div class="card"><h2>Weekly training plan</h2>
${plan.map((x,i)=>`<div class="row day ${i===day?"active":""}">
<button onclick="choose(${i})">
<b>${days[i]}</b> · ${esc(x.name)}</button>
<span class="muted">${x.minutes}m</span>
</div>`).join("")}
</div>`;
}
if(stage==="ready"){
$("today").innerHTML=`
<h1>How are you feeling?</h1>
<div class="card">
<h2>Daily readiness</h2>
<p>Energy</p>
<div class="choices">
${[1,2,3,4,5].map(n=>`<button
class="choice ${ready.energy===n?"on":""}"
onclick="setReady('energy',${n})">${n}</button>`).join("")}
</div>
<p class="muted">1 low · 5 excellent</p>
<p>Muscle soreness</p>
<div class="choices">
${[1,2,3,4,5].map(n=>`<button
class="choice ${ready.soreness===n?"on":""}"
onclick="setReady('soreness',${n})">${n}</button>`).join("")}
</div>
<p class="muted">1 none · 5 very sore</p>
<p>Time available</p>
<div class="choices">
${[10,20,30,40,45].map(n=>`<button
class="choice ${ready.time===n?"on":""}"
onclick="setReady('time',${n})">${n}m</button>`).join("")}
</div>
<label class="check">
<input type="checkbox" ${ready.pain?"checked":""}
onchange="ready.pain=this.checked;render()">
I have pain or discomfort today
</label>
${ready.pain?`<div class="note">
Avoid painful exercises. If pain is new, significant, or unexplained, don't push through it.
</div>`:""}
${ready.energy<=2||ready.soreness>=4?`<p class="note">
Low readiness today. Consider a recovery session or reduce your workout volume.
</p>`:""}
<p class="muted">This check does not automatically change your workout.</p>
<button class="btn wide" onclick="stage='weights';render()">
Review my sets →</button>
</div>`;
}
if(stage==="weights"){
$("today").innerHTML=`
<h1>Your exact workout.</h1>
<div class="card">
<p class="muted">Each column is one set. Weights for two-dumbbell exercises are per hand. These are starting estimates, not tested limits.</p>
${w.ex.map((x,i)=>`
<div class="exercise">
<h3>${esc(x[0])}</h3>
<p class="muted">${x[3]==="pair"?"Two dumbbells · weight per hand":
x[3]==="one"?"One dumbbell":"Bodyweight"}</p>
<div class="note">${esc(recommendation(i))}</div>
${x[1].map((r,j)=>`
<div class="row day">
<span><b>Set ${j+1}</b> · ${r} ${/minutes|seconds/i.test(x[0])?"min/sec":"reps"}</span>
${x[3]==="none"?`<span class="muted">Bodyweight</span>`:
`<select aria-label="Set ${j+1} weight"
onchange="changeWeight(${i},${j},this.value)">
${options.map(n=>`<option value="${n}"
${weights(i)[j]===n?"selected":""}>
${n?n+" lb":"Bodyweight"}</option>`).join("")}
</select>`}
</div>`).join("")}
</div>`).join("")}
<button class="btn wide" onclick="checks={};stage='gear';render()">
Equipment checklist →</button>
</div>`;
}
if(stage==="gear"){
const items=gear();
$("today").innerHTML=`
<h1>Prepare your space.</h1>
<div class="card">
<h2>Today's equipment</h2>
${items.map((x,i)=>`<label class="check">
<input type="checkbox" ${checks[i]?"checked":""}
onchange="checks[${i}]=this.checked;checkReady()">
${esc(x)}
</label>`).join("")}
<button id="start" class="btn wide"
${items.every((_,i)=>checks[i])?"":"disabled"}
onclick="launch()">Start workout →</button>
</div>
<button class="btn outline" onclick="stage='weights';render()">
Adjust weights</button>`;
}
if(stage==="work"){
const x=plan[session.day];
const completed=session.sets.flat().filter(s=>s.done).length;
const total=session.sets.flat().length;
$("today").innerHTML=`
<h1>${esc(x.name)}</h1>
<div class="card hero">
<div class="eyebrow">SETS COMPLETED</div>
<div class="stat">${completed} / ${total}</div>
<p class="muted">Rest naturally for about 60–90 seconds between sets. No timer.</p>
</div>
<div class="card">
${x.ex.map((e,i)=>`
<div class="exercise">
<h3>${i+1}. ${esc(e[0])}</h3>
<p class="muted">${e[3]==="pair"?"Weight per dumbbell":
e[3]==="one"?"One dumbbell":"Bodyweight"}</p>
${session.sets[i].map((s,j)=>`
<div class="set">
<span>${j+1}</span>
<label>Reps / time
<input type="number" min="0" max="999" value="${s.reps}"
onchange="edit(${i},${j},'reps',this.value)">
</label>
<label>Weight lb
<input type="number" min="0" max="100" value="${s.weight}"
onchange="edit(${i},${j},'weight',this.value)">
</label>
<button class="${s.done?"done":""}"
onclick="mark(${i},${j})">${s.done?"✓":"Done"}</button>
</div>`).join("")}
<p class="muted">How did the final set feel?</p>
<select aria-label="Exercise effort"
onchange="effort(${i},this.value)">
<option value="">Choose effort</option>
${[
["easy","Easy · 4+ reps left"],
["right","Just right · 2–3 reps left"],
["hard","Very hard · barely finished"],
["pain","Pain or discomfort"]
].map(o=>`<option value="${o[0]}"
${session.efforts[i]===o[0]?"selected":""}>
${o[1]}</option>`).join("")}
</select>
</div>`).join("")}
<button class="btn wide" onclick="finish()">Finish workout ✓</button>
</div>
<button class="btn outline" onclick="exitWorkout()">
Save & exit</button>`;
}
}
function setReady(k,n){ready[k]=n;render()}
function checkReady(){
$("start").disabled=!gear().every((_,i)=>checks[i]);
}
function launch(){
session={
day,
date:new Date().toISOString(),
readiness:{...ready},
sets:plan[day].ex.map((x,i)=>
x[1].map((r,j)=>({
reps:r,weight:weights(i)[j],done:false
}))),
efforts:{}
};
db.draft=session;
save();
stage="work";render();
}
function edit(i,j,k,v){
const n=Number(v);
if(!Number.isFinite(n)||n<0||n>999)return;
session.sets[i][j][k]=n;
db.draft=session;save();
}
function mark(i,j){
session.sets[i][j].done=!session.sets[i][j].done;
db.draft=session;save();render();
}
function effort(i,v){
session.efforts[i]=v;
db.draft=session;save();
}
function exitWorkout(){
db.draft=session;save();
session=null;stage="home";render();
}
function resume(){
if(!db.draft)return;
session=db.draft;
day=session.day;
session.efforts??={};
stage="work";
tab("today");
render();
}
function finish(){
const all=session.sets.flat();
const done=all.filter(s=>s.done).length;
if(!done){
alert("Complete at least one set before finishing.");
return;
}
if(!confirm("Finish and save this workout?"))return;
const x=plan[session.day];
const details=x.ex.map((e,i)=>({
name:e[0],
sets:session.sets[i].map(s=>({...s})),
effort:session.efforts[i]||""
}));
db.history.push({
id:"w-"+Date.now(),
date:new Date().toISOString(),
name:x.name,
completed:done,total:all.length,
details,
readiness:session.readiness
});
Object.keys(session.efforts).forEach(i=>{
if(session.efforts[i])
db.feedback[session.day+"-"+i]=session.efforts[i];
});
db.draft=null;
save();
session=null;
stage="home";
render();
tab("progress");
}
function progress(){
$("progress").innerHTML=`
<h1>Your progress.</h1>
<div class="card hero">
<div class="eyebrow">WORKOUTS RECORDED</div>
<div class="stat">${db.history.length}</div>
</div>
<div class="card">
<h2>Workout history</h2>
${db.history.length?
db.history.slice().reverse().map(x=>`
<div class="day">
<div class="row">
<div><b>${esc(x.name||"Workout")}</b>
<div class="muted">
${x.date?new Date(x.date).toLocaleDateString():""}
 · ${x.completed??0}/${x.total??0}
 ${x.legacy?"exercises":"sets"}
</div></div>
<button class="btn outline small"
onclick="removeWorkout(${JSON.stringify(String(x.id)).replace(/"/g,"&quot;")})">
Delete</button>
</div>
${Array.isArray(x.details)?`
<details><summary class="muted">View sets and weights</summary>
${x.details.map(e=>`
<p class="muted"><b>${esc(e.name)}</b><br>
${e.sets.map((s,j)=>`Set ${j+1}: ${s.reps} reps · ${s.weight} lb ${s.done?"✓":""}`).join("<br>")}
${e.effort?"<br>Effort: "+esc(e.effort):""}
</p>`).join("")}
</details>`:""}
</div>`).join(""):
'<p class="muted">No completed workouts yet.</p>'}
</div>
<p class="muted">Your workout history stays in this browser's local storage. Clearing website data can erase it.</p>`;
}
function removeWorkout(id){
if(!confirm("Permanently delete this workout?"))return;
db.history=db.history.filter(x=>String(x.id)!==id);
save();progress();
}
function coach(){
$("coach").innerHTML=`
<h1>Your coach.</h1>
<div class="card hero">
<h2>Progress at your pace.</h2>
<p>Start with controlled movement and gradually rebuild toward your previous strength.</p>
</div>
<div class="card">
<h2>Progression guidelines</h2>
<p><b>Easy:</b> If you complete every set comfortably with good form, consider the smallest available increase next session.</p>
<p><b>Just right:</b> Repeat the weight until consistently controlled.</p>
<p><b>Very hard:</b> Maintain or reduce the weight.</p>
<p><b>Pain:</b> Stop the painful movement and reassess.</p>
<p class="muted">The app records effort and shows guidance. It does not automatically calculate your next weights yet.</p>
</div>`;
}
$("nutrition").innerHTML=`
<h1>Nourish yourself.</h1>
<div class="card">
<h2>Nutrition studio</h2>
<p class="muted">Meal planning and nutrition tracking are planned for a future version.</p>
</div>`;
render();
</script>
</body>
</html>
