
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F8F5EF">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Forme AI | Personal Strength Studio</title>
<style>
:root{
--cream:#f8f5ef;
--paper:#fffdfa;
--green:#243629;
--sage:#778e77;
--pale:#eef0e8;
--border:#dcded2;
--muted:#737e73;
}
*{box-sizing:border-box}
body{
margin:0;
background:var(--cream);
color:var(--green);
font-family:-apple-system,BlinkMacSystemFont,
"Helvetica Neue",sans-serif;
-webkit-font-smoothing:antialiased;
}
header,main{
max-width:1000px;
margin:auto;
}
header{
padding:25px 22px 10px;
display:flex;
align-items:center;
justify-content:space-between;
}
.logo{
font:normal 37px Georgia,serif;
letter-spacing:-1px;
}
.logo span{color:var(--sage)}
.header-right{
font:18px Georgia,serif;
}
main{
padding:15px 18px 115px;
}
h1,h2,h3{
font-family:Georgia,serif;
font-weight:normal;
}
h1{
font-size:clamp(30px,5vw,55px);
line-height:1.1;
margin:12px 0;
}
h2{font-size:26px;margin:0 0 10px}
h3{font-size:21px;margin:0}
p{line-height:1.5}
.muted{
color:var(--muted);
font-size:13px;
}
.eyebrow{
font-size:11px;
letter-spacing:1.6px;
font-weight:700;
color:var(--sage);
}
.hero{
text-align:center;
padding:20px 0 23px;
}
.meta{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:18px;
font-size:14px;
margin:15px 0;
}
.equipment{
background:var(--pale);
border:1px solid var(--border);
border-radius:16px;
padding:15px 18px;
margin:10px 0 20px;
}
.equipment-items{
display:flex;
flex-wrap:wrap;
gap:8px;
margin-top:10px;
}
.chip{
background:var(--paper);
border:1px solid var(--border);
border-radius:30px;
padding:9px 13px;
font-size:13px;
font-weight:600;
}
.card{
background:var(--paper);
border:1px solid var(--border);
border-radius:19px;
margin-bottom:13px;
overflow:hidden;
}
.exercise{
display:grid;
grid-template-columns:180px minmax(0,1fr);
align-items:stretch;
min-height:150px;
}
.visual{
background:linear-gradient(140deg,#eae6dc,#dfe8dc);
min-height:145px;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
position:relative;
}
.visual img{
display:block;
width:100%;
height:100%;
object-fit:cover;
position:absolute;
inset:0;
}
.fallback{
text-align:center;
padding:12px;
color:var(--green);
}
.fallback-icon{
font-size:32px;
margin-bottom:7px;
}
.fallback small{
display:block;
font-size:11px;
line-height:1.4;
color:var(--muted);
}
.exercise-body{
padding:15px 17px;
min-width:0;
}
.exercise-title{
font:normal 25px Georgia,serif;
line-height:1.12;
margin-bottom:7px;
}
.cue{
font-size:12px;
color:var(--muted);
margin:0 0 12px;
}
.sets{
display:flex;
gap:8px;
flex-wrap:wrap;
}
.set-box{
flex:1 1 72px;
min-width:72px;
background:var(--pale);
border:1px solid #cbd1c2;
border-radius:13px;
padding:10px 5px;
text-align:center;
color:var(--green);
cursor:pointer;
font:inherit;
}
.set-box strong{
display:block;
font-size:15px;
margin:4px 0;
}
.set-box small{
font-size:11px;
color:var(--muted);
}
.set-box.done{
background:var(--sage);
color:white;
border-color:var(--sage);
}
.set-box.done small{color:white}
.controls{
display:flex;
gap:9px;
flex-wrap:wrap;
margin-top:12px;
}
.btn{
background:var(--green);
color:white;
border:0;
border-radius:12px;
padding:13px 17px;
font:600 14px -apple-system,sans-serif;
min-height:44px;
cursor:pointer;
}
.btn.secondary{
background:var(--paper);
color:var(--green);
border:1px solid var(--border);
}
.btn.small{
padding:8px 11px;
font-size:12px;
min-height:35px;
}
.btn.wide{width:100%}
.session-progress{
background:var(--pale);
padding:14px;
border-radius:13px;
margin-bottom:15px;
}
.progress-track{
height:7px;
border-radius:10px;
background:#d6ded2;
overflow:hidden;
margin-top:9px;
}
.progress-fill{
height:100%;
background:var(--sage);
transition:width .2s;
}
.week{
padding:15px;
}
.week-row{
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid var(--border);
padding:12px 0;
gap:12px;
}
.week-row:last-child{border:0}
.week-row button{
border:0;
background:none;
text-align:left;
font:inherit;
color:var(--green);
flex:1;
}
.week-row.selected button{
font-weight:700;
color:#55775a;
}
.detail{
padding:15px;
}
.detail summary{
cursor:pointer;
font-size:13px;
color:var(--sage);
}
.edit-row{
display:grid;
grid-template-columns:50px 1fr 1fr;
gap:9px;
align-items:center;
padding:8px 0;
}
.edit-row input{
min-width:0;
width:100%;
padding:10px 6px;
border-radius:9px;
border:1px solid var(--border);
font:inherit;
background:white;
}
.edit-row label{
font-size:11px;
color:var(--muted);
}
select{
width:100%;
border:1px solid var(--border);
border-radius:10px;
padding:11px;
font:inherit;
background:white;
color:var(--green);
}
.section{
margin-top:22px;
}
.hidden{display:none!important}
nav{
position:fixed;
bottom:0;
left:0;
right:0;
display:flex;
background:var(--paper);
border-top:1px solid var(--border);
padding:8px 5px calc(9px + env(safe-area-inset-bottom));
z-index:20;
}
nav button{
flex:1;
border:0;
background:none;
color:var(--muted);
font-size:12px;
padding:11px 0;
}
nav button.on{
color:var(--sage);
font-weight:700;
}
@media(max-width:550px){
header{padding:19px 18px 5px}
.logo{font-size:32px}
.header-right{font-size:14px}
main{padding:8px 12px 115px}
.hero{padding:15px 3px 18px}
.meta{gap:11px;font-size:12px}
.exercise{
grid-template-columns:110px minmax(0,1fr);
min-height:160px;
}
.visual{min-height:160px}
.exercise-body{padding:12px 10px}
.exercise-title{font-size:19px}
.cue{font-size:11px}
.sets{gap:5px}
.set-box{
min-width:57px;
flex:1 1 57px;
padding:9px 2px;
border-radius:10px;
}
.set-box strong{font-size:12px}
.set-box small{font-size:10px}
.fallback-icon{font-size:25px}
}
</style>
</head>
<body>

<header>
<div class="logo">forme<span>.</span> ai</div>
<div class="header-right">Today's Workout</div>
</header>

<main>
<section id="today"></section>
<section id="progress" class="hidden"></section>
<section id="coach" class="hidden"></section>
</main>

<nav>
<button class="on" onclick="showTab('today')">Today</button>
<button onclick="showTab('progress')">Progress</button>
<button onclick="showTab('coach')">Coach</button>
</nav>

<script>
"use strict";

/*
FORME AI V0.5

Each exercise:
name, reps, weights, equipment,
movement cue, GIF filename, type

Equipment:
pair = two dumbbells, weight per hand
one = one dumbbell
none = no dumbbell

Types:
reps, minutes, seconds

The GIFs are separate assets in /media.
*/

const workouts=[
{
name:"Full Body Strength A",
minutes:40,
ex:[
["Goblet Squat",
[15,12,10],[10,15,15],"one",
"Chest tall · Sit between hips",
"goblet-squat.gif","reps"],
["Dumbbell Floor Press",
[12,10,8],[5,8,10],"pair",
"Elbows slightly tucked",
"floor-press.gif","reps"],
["Bent-over Dumbbell Row",
[15,12,10],[8,10,10],"pair",
"Hinge at hips · Row toward ribs",
"bent-over-row.gif","reps"],
["Dumbbell Romanian Deadlift",
[15,12,10],[10,15,15],"pair",
"Push hips back · Keep back neutral",
"romanian-deadlift.gif","reps"],
["Dead Bug (per side)",
[8,8],[0,0],"none",
"Slow and controlled",
"dead-bug.gif","reps"]
]},
{
name:"Indoor Walk + Core",
minutes:30,
ex:[
["Indoor Walking",
[20],[0],"none",
"Comfortable walking pace",
"indoor-walk.gif","minutes"],
["Dead Bug (per side)",
[8,8],[0,0],"none",
"Keep your trunk steady",
"dead-bug.gif","reps"],
["Bird Dog (per side)",
[8,8],[0,0],"none",
"Keep hips level",
"bird-dog.gif","reps"]
]},
{
name:"Full Body Strength B",
minutes:40,
ex:[
["Reverse Lunge (per leg)",
[12,10,8],[0,5,8],"pair",
"Step back with control",
"reverse-lunge.gif","reps"],
["Standing Shoulder Press",
[15,12,10],[5,8,8],"pair",
"Keep ribs down",
"shoulder-press.gif","reps"],
["Bent-over Dumbbell Row",
[15,12,10],[8,10,10],"pair",
"Stable torso",
"bent-over-row.gif","reps"],
["Floor Glute Bridge",
[15,12,10],[0,0,0],"none",
"Squeeze glutes at the top",
"glute-bridge.gif","reps"],
["Side Plank (per side)",
[20,25],[0,0],"none",
"Keep body aligned",
"side-plank.gif","seconds"]
]},
{
name:"Recovery + Mobility",
minutes:25,
ex:[
["Indoor Walking",
[10],[0],"none",
"Easy walking pace",
"indoor-walk.gif","minutes"],
["Cat-Cow",
[8,8],[0,0],"none",
"Gentle spinal movement",
"cat-cow.gif","reps"],
["Hip Mobility",
[5],[0],"none",
"Comfortable range of motion",
"hip-mobility.gif","minutes"],
["Gentle Stretching",
[5],[0],"none",
"Breathe and relax",
"stretching.gif","minutes"]
]},
{
name:"Full Body Circuit",
minutes:40,
ex:[
["Squat to Press",
[12,10,8],[5,5,8],"pair",
"Smooth, controlled movement",
"squat-to-press.gif","reps"],
["Alternating Reverse Lunge",
[15,12,10],[0,5,5],"pair",
"Reps total · Alternate legs",
"reverse-lunge.gif","reps"],
["Dumbbell Row",
[15,12,10],[8,10,10],"pair",
"Reps total · Controlled row",
"bent-over-row.gif","reps"],
["Bicycle Crunch",
[20,20],[0,0],"none",
"Reps total · No neck pulling",
"bicycle-crunch.gif","reps"],
["Wall Sit",
[30,40],[0,0],"none",
"Keep feet planted",
"wall-sit.gif","seconds"]
]},
{
name:"Glutes, Arms + Core",
minutes:35,
ex:[
["Dumbbell Sumo Squat",
[15,12,10],[10,15,15],"one",
"Knees track over toes",
"sumo-squat.gif","reps"],
["Floor Glute Bridge",
[15,12,10],[0,0,0],"none",
"Drive through heels",
"glute-bridge.gif","reps"],
["Dumbbell Biceps Curl",
[15,12,10],[5,8,8],"pair",
"Elbows near sides",
"biceps-curl.gif","reps"],
["Dumbbell Lateral Raise",
[12,10,8],[5,5,5],"pair",
"Lift without shrugging",
"lateral-raise.gif","reps"],
["Bird Dog (per side)",
[8,8],[0,0],"none",
"Keep your hips steady",
"bird-dog.gif","reps"]
]},
{
name:"Easy Walk + Stretch",
minutes:25,
ex:[
["Indoor Walking",
[20],[0],"none",
"Relaxed walking pace",
"indoor-walk.gif","minutes"],
["Gentle Stretching",
[5],[0],"none",
"Comfortable, gentle stretching",
"stretching.gif","minutes"]
]}
];

const days=[
"Monday","Tuesday","Wednesday",
"Thursday","Friday","Saturday","Sunday"
];

const $=id=>document.getElementById(id);

function escapeHTML(value){
return String(value).replace(/[&<>"']/g,c=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
}[c]));
}

function load(key,fallback){
try{
return JSON.parse(localStorage.getItem(key))??fallback;
}catch{
return fallback;
}
}

let db=load("forme_v05",null);

if(!db||typeof db!=="object"){
db={
history:[],
weights:{},
feedback:{},
draft:null
};
}

db.history??=[];
db.weights??={};
db.feedback??={};
db.draft??=null;

function save(){
try{
localStorage.setItem("forme_v05",JSON.stringify(db));
return true;
}catch{
alert("Unable to save workout data.");
return false;
}
}

/* Import earlier history once. */
if(!db.migrated){
const v4=load("forme_v04",null);
const v3=load("forme_v03",null);
const v2=load("forme_v02",null);
const v1=load("forme_logs",[]);

const source=[v4,v3,v2].find(x=>
x&&Array.isArray(x.history)
);

if(source){
db.history=source.history.map((x,i)=>({
...x,
id:"import-"+i+"-"+String(x.id??"")
}));

if(source.weights&&
typeof source.weights==="object"){
db.weights=source.weights;
}

if(source.feedback&&
typeof source.feedback==="object"){
db.feedback=source.feedback;
}
}else if(Array.isArray(v1)){
db.history=v1.map((x,i)=>({
...x,
id:"import-v1-"+i,
legacy:true
}));
}

db.migrated=true;
save();
}

let selectedDay=(new Date().getDay()+6)%7;
let activeSession=null;

function weightKey(d,i){
return d+"-"+i;
}

function getWeights(d,i){
const x=workouts[d].ex[i];
const saved=db.weights[weightKey(d,i)];

if(Array.isArray(saved)&&
saved.length===x[1].length){
return saved.slice();
}
return x[2].slice();
}

function equipment(d,sets){
const needed=new Set();
let mat=false;

workouts[d].ex.forEach((x,i)=>{
const amounts=sets?
sets[i].map(s=>s.weight):
getWeights(d,i);

if(x[3]!=="none"){
amounts.forEach(n=>{
if(Number(n)>0)needed.add(Number(n));
});
}

if(/floor|dead bug|bird dog|plank|stretch|mobility|cat-cow|crunch|bridge/i.test(x[0])){
mat=true;
}
});

const items=[...needed]
.sort((a,b)=>a-b)
.map(n=>n+" lb dumbbells");

if(mat)items.push("Yoga mat");
items.push("Water bottle");

return items;
}

function equipmentHTML(d,sets){
return `
<div class="equipment">
<div class="eyebrow">TODAY'S EQUIPMENT</div>
<div class="equipment-items">
${equipment(d,sets).map(x=>
`<span class="chip">${escapeHTML(x)}</span>`
).join("")}
</div>
<p class="muted" style="margin-bottom:0">
Bring pairs of the listed dumbbell weights.
For goblet and sumo squats, use one dumbbell.
</p>
</div>`;
}

function gifHTML(x){
return `
<div class="visual">
<img
src="media/${encodeURIComponent(x[5])}"
alt="${escapeHTML(x[0])} demonstration"
loading="lazy"
onerror="this.hidden=true;this.nextElementSibling.hidden=false">
<div class="fallback" hidden>
<div class="fallback-icon">◌</div>
<strong>${escapeHTML(x[0])}</strong>
<small>${escapeHTML(x[4])}</small>
</div>
</div>`;
}

function showTab(name){
["today","progress","coach"].forEach(x=>{
$(x).classList.toggle("hidden",x!==name);
});

document.querySelectorAll("nav button").forEach((b,i)=>{
b.classList.toggle("on",
["today","progress","coach"][i]===name);
});

if(name==="progress")renderProgress();
if(name==="coach")renderCoach();
if(name==="today")renderToday();
}

function chooseDay(i){
selectedDay=i;
renderToday();
window.scrollTo(0,0);
}

function setDescription(x,reps,weight){
const unit=x[6]==="minutes"?"min":
x[6]==="seconds"?"sec":"reps";

return reps+" "+unit+
(x[3]!=="none"?" · "+weight+" lb":"");
}

function renderToday(){
const w=workouts[selectedDay];

if(activeSession){
renderSession();
return;
}

$("today").innerHTML=`
<div class="hero">
<div class="eyebrow">
${days[selectedDay].toUpperCase()} · YOUR WORKOUT
</div>
<h1>${escapeHTML(w.name)}</h1>
<div class="meta">
<span>◷ ~${w.minutes} minutes</span>
<span>♧ ${w.ex.length} exercises</span>
<span>⌂ Home studio</span>
</div>
</div>

${db.draft?`
<div class="card detail">
<h3>Workout in progress</h3>
<p class="muted">
${escapeHTML(workouts[db.draft.day]?.name||"Saved workout")}
</p>
<button class="btn wide" onclick="resumeWorkout()">
Resume workout →
</button>
</div>`:""}

${equipmentHTML(selectedDay)}

<div class="controls" style="margin-bottom:20px">
<button class="btn wide" onclick="startWorkout()">
Start Workout →
</button>
</div>

<div class="eyebrow" style="margin:15px 0">
TODAY'S EXERCISES
</div>

${w.ex.map((x,i)=>`
<div class="card exercise">
${gifHTML(x)}
<div class="exercise-body">
<div class="exercise-title">
${escapeHTML(x[0])}
</div>
<p class="cue">${escapeHTML(x[4])}</p>
<div class="sets">
${x[1].map((r,j)=>`
<div class="set-box" style="cursor:default">
<small>Set ${j+1}</small>
<strong>${r} ${x[6]==="minutes"?"min":
x[6]==="seconds"?"sec":"reps"}</strong>
<small>${x[3]==="none"?"Bodyweight":
getWeights(selectedDay,i)[j]+" lb"}</small>
</div>`).join("")}
</div>
</div>
</div>`).join("")}

<div class="section card week">
<h3>Your Weekly Plan</h3>
${workouts.map((x,i)=>`
<div class="week-row ${i===selectedDay?"selected":""}">
<button onclick="chooseDay(${i})">
${days[i]} · ${escapeHTML(x.name)}
</button>
<span class="muted">${x.minutes} min</span>
</div>`).join("")}
</div>`;
}

function startWorkout(){
if(db.draft){
if(!confirm(
"Replace your unfinished workout with a new session?"
))return;
}

activeSession={
day:selectedDay,
date:new Date().toISOString(),
sets:workouts[selectedDay].ex.map((x,i)=>
x[1].map((reps,j)=>({
reps,
weight:getWeights(selectedDay,i)[j],
done:false
}))),
efforts:{}
};

db.draft=activeSession;
if(!save())return;
renderSession();
window.scrollTo(0,0);
}

function resumeWorkout(){
if(!db.draft)return;

const s=db.draft;

if(!Number.isInteger(s.day)||
!workouts[s.day]||
!Array.isArray(s.sets)){
alert("Saved workout could not be resumed.");
return;
}

activeSession=s;
activeSession.efforts??={};
selectedDay=s.day;
renderSession();
window.scrollTo(0,0);
}

function renderSession(){
const s=activeSession;
const w=workouts[s.day];

const all=s.sets.flat();
const done=all.filter(x=>x.done).length;
const total=all.length;

$("today").innerHTML=`
<div class="hero">
<div class="eyebrow">WORKOUT IN PROGRESS</div>
<h1>${escapeHTML(w.name)}</h1>
</div>

<div class="session-progress">
<div class="row">
<strong>${done} of ${total} sets complete</strong>
<span class="muted">
${Math.round(done/total*100)}%
</span>
</div>
<div class="progress-track">
<div class="progress-fill"
style="width:${done/total*100}%"></div>
</div>
</div>

${equipmentHTML(s.day,s.sets)}

${w.ex.map((x,i)=>`
<div class="card exercise">
${gifHTML(x)}
<div class="exercise-body">
<div class="eyebrow">EXERCISE ${i+1}</div>
<div class="exercise-title">
${escapeHTML(x[0])}
</div>
<p class="cue">${escapeHTML(x[4])}</p>

<div class="sets">
${s.sets[i].map((set,j)=>`
<button
class="set-box ${set.done?"done":""}"
onclick="toggleSet(${i},${j})">
<small>Set ${j+1}</small>
<strong>${set.done?"✓ ":""}${set.reps}
${x[6]==="minutes"?"min":
x[6]==="seconds"?"sec":"reps"}</strong>
<small>${x[3]==="none"?"Bodyweight":
set.weight+" lb"}</small>
</button>`).join("")}
</div>

<details style="margin-top:12px">
<summary class="muted">
Adjust reps / weights
</summary>
<div style="margin-top:10px">
${s.sets[i].map((set,j)=>`
<div class="edit-row">
<strong>Set ${j+1}</strong>
<label>${x[6]==="minutes"?"Minutes":
x[6]==="seconds"?"Seconds":"Reps"}
<input type="number"
min="0" max="999"
value="${set.reps}"
onchange="editSet(${i},${j},'reps',this.value)">
</label>
<label>Weight lb
<input type="number"
min="0" max="100"
value="${set.weight}"
${x[3]==="none"?"disabled":""}
onchange="editSet(${i},${j},'weight',this.value)">
</label>
</div>`).join("")}
</div>
</details>

<details style="margin-top:12px">
<summary class="muted">
Optional effort feedback
</summary>
<select style="margin-top:10px"
onchange="setEffort(${i},this.value)">
<option value="">Select effort</option>
${[
["easy","Easy — 4+ reps left"],
["right","Just right — 2–3 reps left"],
["hard","Very hard"],
["pain","Pain or discomfort"]
].map(([v,label])=>`
<option value="${v}"
${s.efforts[i]===v?"selected":""}>
${label}
</option>`).join("")}
</select>
</details>

</div>
</div>`).join("")}

<div class="controls">
<button class="btn wide"
onclick="finishWorkout()">
Finish Workout ✓
</button>
<button class="btn secondary wide"
onclick="saveAndExit()">
Save & Exit
</button>
</div>`;
}

function toggleSet(i,j){
activeSession.sets[i][j].done=
!activeSession.sets[i][j].done;

db.draft=activeSession;
save();

const y=window.scrollY;
renderSession();
window.scrollTo(0,y);
}

function editSet(i,j,field,value){
const n=Number(value);

if(!Number.isFinite(n)||n<0||n>999)return;

activeSession.sets[i][j][field]=n;
db.draft=activeSession;
save();
}

function setEffort(i,value){
activeSession.efforts[i]=value;
db.draft=activeSession;
save();
}

function saveAndExit(){
db.draft=activeSession;
save();
activeSession=null;
renderToday();
window.scrollTo(0,0);
}

function finishWorkout(){
const s=activeSession;
const all=s.sets.flat();
const completed=all.filter(x=>x.done).length;

if(completed===0){
alert("Complete at least one set first.");
return;
}

if(!confirm("Finish and save this workout?"))return;

const d=s.day;

db.history.push({
id:"v5-"+Date.now(),
date:new Date().toISOString(),
name:workouts[d].name,
completed,
total:all.length,
details:workouts[d].ex.map((x,i)=>({
name:x[0],
type:x[6],
equipment:x[3],
sets:s.sets[i].map(y=>({...y})),
effort:s.efforts[i]||""
}))
});

s.sets.forEach((sets,i)=>{
if(sets.every(x=>x.done)){
db.weights[weightKey(d,i)]=
sets.map(x=>x.weight);
}

if(s.efforts[i]){
db.feedback[weightKey(d,i)]=s.efforts[i];
}
});

db.draft=null;
save();

activeSession=null;
renderToday();
showTab("progress");
window.scrollTo(0,0);
}

function deleteWorkout(id){
if(!confirm("Delete this workout permanently?"))return;

db.history=db.history.filter(x=>
String(x.id)!==String(id)
);
save();
renderProgress();
}

db.history.slice().reverse().map(x=>`

${x.legacy?"exercises":"sets"}

${Array.isArray(x.details)?`

}
