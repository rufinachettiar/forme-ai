
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f8f6f0">
<title>Forme AI — Your Personal Strength Coach</title>
<style>
:root{--bg:#f8f6f0;--paper:#fffefa;--forest:#243d32;--sage:#c5d3bd;--sage-dark:#6b826c;--ink:#27372d;--muted:#758077;--line:#e9e9e0;--warm:#f3f0e8;--shadow:0 9px 32px rgba(40,60,44,.045)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #668e6b;outline-offset:2px}
.shell{max-width:980px;margin:auto;padding:22px 20px 100px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-bottom:24px;border-bottom:1px solid var(--line)}
.brand{font-family:Georgia,serif;font-size:34px;letter-spacing:-2px;color:var(--forest);line-height:1}
.brand span{font-family:Arial,sans-serif;font-size:11px;letter-spacing:0;margin-left:5px;color:var(--sage-dark)}
.top small{color:var(--muted)}
.nav{display:flex;gap:7px;overflow:auto;padding:17px 0 8px;scrollbar-width:none}
.nav button,.chip,.outline{border:1px solid #e3e7dc;background:#fffdf8;color:var(--forest);border-radius:999px;padding:9px 14px;white-space:nowrap}
.nav button.active,.chip.active{background:var(--forest);color:white;border-color:var(--forest)}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:2px;font-weight:700;color:var(--sage-dark);margin:26px 0 6px}
.hero{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}
.hero h1,h1,h2{font-family:Georgia,serif;font-weight:400;color:var(--forest)}
.hero h1{font-size:clamp(30px,5vw,49px);line-height:1.08;letter-spacing:-1px;margin:4px 0 14px}
.hero p{color:var(--muted);margin:0}
.small{font-size:12px;color:var(--muted)}
.pillrow{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.pill{background:#eff1e8;color:#506d55;padding:7px 11px;border-radius:99px;font-size:12px}
.card{background:var(--paper);border:1px solid #ecece3;border-radius:18px;box-shadow:var(--shadow)}
.progress-wrap{display:flex;align-items:center;gap:12px;margin:18px 0 20px}
.track{height:8px;background:#e7ebe3;border-radius:99px;flex:1;overflow:hidden}
.fill{height:100%;background:#829d7e;border-radius:99px;transition:width .2s}
.progress-num{color:var(--sage-dark);font-weight:700;min-width:44px;text-align:right}
.sectionrow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:20px 0 12px}
.sectionrow h2{font-size:23px;margin:0}
.daybar{display:flex;gap:7px;overflow-x:auto;padding:7px 0 12px}
.daybtn{flex:1;min-width:72px;border:1px solid var(--line);border-radius:14px;padding:10px 7px;background:#fffefa;color:var(--ink)}
.daybtn strong{display:block;font-size:12px}
.daybtn span{font-size:11px;color:var(--muted)}
.daybtn.selected{background:var(--forest);color:white}
.daybtn.selected span{color:#d4dfd2}
.exercises{display:grid;gap:12px}
.exercise{display:grid;grid-template-columns:150px minmax(150px,1fr) minmax(260px,auto);align-items:center;min-height:122px;overflow:hidden}
.photo{width:150px;height:122px;object-fit:cover;object-position:center;background:#ecebe3;display:block}
.exercise-main{padding:12px 14px}
.exercise-main h3{font-family:Georgia,serif;font-weight:400;color:var(--forest);font-size:19px;line-height:1.18;margin:0 0 7px}
.exercise-main .cue{color:var(--muted);font-size:11px;line-height:1.35}
.setsarea{padding:12px 16px 12px 4px}
.setslabel{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin:0 0 7px}
.sets{display:flex;gap:6px;justify-content:flex-end}
.set{border:1px solid #e7e8dd;background:#f5f4ed;color:#3d4e40;border-radius:10px;padding:9px 6px;min-width:70px;min-height:57px;line-height:1.2}
.set strong{display:block;font-size:13px;font-weight:650}
.set span{font-size:10px;color:#748074}
.set.done{background:#b9d1b4;border-color:#93b28e;color:#234c30}
.set.done span{color:#365c3a}
.set:active{transform:scale(.98)}
.equipment{padding:15px 17px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:14px 0}
.equipment b{font-family:Georgia,serif;font-weight:400;font-size:18px}
.equipment span{font-size:12px;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin:19px 0}
.primary{border:0;background:var(--forest);color:white;border-radius:12px;padding:13px 20px;font-weight:600}
.primary:disabled{opacity:.45;cursor:not-allowed}
.secondary{border:1px solid #dfe5d9;background:var(--paper);color:var(--forest);border-radius:12px;padding:12px 17px}
.hint{font-size:12px;color:var(--muted);margin-top:8px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.stat{padding:19px}
.stat label{display:block;color:var(--muted);font-size:12px}
.stat strong{font-family:Georgia,serif;font-size:30px;color:var(--forest);font-weight:400}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;color:var(--muted)}
.field input,.field select{background:#fffefa;border:1px solid #dfe4d9;border-radius:10px;padding:11px;width:100%;color:var(--ink)}
.formgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.panel{padding:20px;margin:14px 0}
.panel h2{margin:0 0 10px;font-size:25px}
.history-item{padding:13px 0;border-bottom:1px solid var(--line)}
.history-item:last-child{border:0}
.history-item strong{color:var(--forest)}
.muted{color:var(--muted)}
.library-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.library-tile{overflow:hidden}
.library-tile img{width:100%;height:125px;object-fit:cover;background:#edeae3}
.library-tile div{padding:10px 12px}
.library-tile strong{font-family:Georgia,serif;font-size:16px;font-weight:400}
.library-tile small{display:block;color:var(--muted)}
.weeknav{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.weeknav select{border-radius:10px;border:1px solid #e2e7de;padding:9px;color:var(--forest);background:white}
.note{padding:14px 16px;border-left:3px solid #a6bda3;background:#f1f4ec;border-radius:6px;font-size:13px;color:#536c56}
.modalback{position:fixed;inset:0;background:#1c2a22aa;display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}
.modal{max-width:440px;width:100%;padding:22px;background:var(--paper);border-radius:18px;max-height:90vh;overflow:auto}
.modal h2{font-size:24px;margin:0 0 12px}
.modal .actions{margin-bottom:0}
.hidden{display:none!important}
.footer{text-align:center;font-size:11px;color:#9ca99d;padding:40px 0 10px}
@media(max-width:760px){
.shell{padding:15px 12px 90px}
.top{padding:7px 2px 17px}
.brand{font-size:29px}
.hero h1{font-size:36px}
.exercise{grid-template-columns:112px minmax(0,1fr);min-height:122px}
.photo{width:112px;height:100%;min-height:122px}
.exercise-main{padding:11px 10px 5px}
.exercise-main h3{font-size:17px}
.setsarea{grid-column:2;padding:0 10px 10px}
.sets{justify-content:flex-start}
.set{min-width:61px;min-height:49px;padding:7px 5px}
.setslabel{margin-bottom:5px}
.exercise-main .cue{display:none}
.library-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.formgrid{grid-template-columns:repeat(2,minmax(0,1fr))
}
}
@media(max-width:360px){
.exercise{grid-template-columns:93px minmax(0,1fr)}
.photo{width:93px}
.set{min-width:56px}
.hero h1{font-size:31px}
}
.ritual{margin:18px 0}
.ritual summary{padding:16px 18px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--forest);font-family:Georgia,serif;font-size:20px;list-style:none}
.ritual summary::-webkit-details-marker{display:none}
.ritual summary small{font:12px -apple-system,BlinkMacSystemFont,sans-serif;color:var(--muted);text-align:right}
.ritual-list{padding:0 17px 14px}
.ritual-item{display:flex;align-items:center;gap:12px;border-top:1px solid var(--line);padding:11px 3px;cursor:pointer}
.ritual-item input{accent-color:#79977b;width:19px;height:19px}
.ritual-item span{display:flex;flex-direction:column}
.ritual-item strong{font-size:14px;font-weight:600}
.ritual-item small{color:var(--muted);font-size:12px}
.ritual-item:has(input:checked) strong{text-decoration:line-through;color:var(--sage-dark)}
</style>
</head>

const AVAILABLE_DUMBBELLS=[5,8,10,15,20,25];
function suggestedWeight(id,base,week){
 if(!(base>0)||week<=1)return base;
 const logs=state.logs.filter(x=>Number(x.week)<week&&Array.isArray(x.items))
  .sort((a,b)=>Number(a.week)-Number(b.week)||String(a.date).localeCompare(String(b.date)));
 let last=null;
 for(const log of logs){
  for(const item of log.items){
   if(item.id!==id)continue;
   const completed=(item.sets||[]).filter(x=>x.done!==false&&Number(x.weight)>0);
   if(completed.length)last={week:Number(log.week)||1,sets:completed};
  }
 }
 const reference=last?Math.max(...last.sets.map(x=>Number(x.weight))):base;
 // Progress only after demonstrated repetitions; otherwise preview a conservative projection.
 const successful=last&&last.sets.length>=2&&last.sets.every(x=>parseFloat(x.reps)>=10);
 const steps=last?(successful?Math.floor(Math.max(0,week-last.week)/3):0):Math.floor((week-1)/4);
 let index=AVAILABLE_DUMBBELLS.findIndex(x=>x>=reference);
 if(index<0)return reference;
 return AVAILABLE_DUMBBELLS[Math.min(AVAILABLE_DUMBBELLS.length-1,index+Math.min(steps,2))];
}

function parseBodyCSV(input){
 const lines=input.replace(/\r/g,'').trim().split('\n').filter(Boolean);
 if(lines.length<2)throw Error('CSV needs a header and measurements');

 const header=lines.shift().split(',')
  .map(x=>x.trim().toLowerCase());

 const expected=[
  'weight (lb)',
  'body fat',
  'muscle mass',
  'water',
  'bmi',
  'bone mass',
  'date/time'
 ];

 if(expected.some(x=>!header.includes(x)))
  throw Error('Expected Weight Gurus CSV columns');

 const idx=k=>header.indexOf(k);
 const pct=v=>{
  const n=Number(String(v||'').replace('%',''));
  return Number.isFinite(n)&&n>0?n:null;
 };

 const added=[];

 for(const line of lines){
  const cells=line.split(',');
  const raw=cells[idx('date/time')]?.trim();
  if(!raw)continue;

  const date=new Date(raw);
  if(!Number.isFinite(date.getTime()))continue;

  const weight=Number(cells[idx('weight (lb)')]);
  if(!(weight>0))continue;

  const row={
   date:date.toISOString(),
   weight,
   bodyFat:pct(cells[idx('body fat')]),
   muscle:pct(cells[idx('muscle mass')]),
   water:pct(cells[idx('water')]),
   bmi:pct(cells[idx('bmi')]),
   bone:pct(cells[idx('bone mass')])
  };
  added.push(row);
 }

 if(!added.length)throw Error('No valid rows found');

 const known=new Set(
  (state.bodyHistory||[]).map(x=>x.date)
 );

 let count=0;
 for(const r of added){
  if(!known.has(r.date)){
   state.bodyHistory.push(r);
   known.add(r.date);
   count++;
  }
 }

 state.bodyHistory.sort((a,b)=>a.date.localeCompare(b.date));
 save();
 return count;
}

 </div>

 <div class="progress-wrap">
  <div class="track"><div class="fill"
   style="width:${percentage}%"></div></div>
  <span class="progress-num">${percentage}%</span>
 </div>

 ${rituals.warm}

 <div class="sectionrow"><h2>02 · Strength & Movement</h2></div>
 <div class="exercises">
 ${draft.items.map((item,i)=>{
  const e=EXERCISES[item.id];
  if(!e)return '';
  return `
  <div class="exercise card">
   ${photo(item.id)}
   <div class="exercise-main">
    <h3>${esc(e.name)}</h3>
    <div class="cue">${esc(e.cue)}</div>
   </div>
   <div class="setsarea">
    <div class="setslabel">Tap each set to record</div>
    <div class="sets">
     ${item.sets.map((s,j)=>`
      <button class="set ${s.done?'done':''}"
       data-set="${i}:${j}"
       title="Tap to edit or complete this set">
       <strong>${esc(setText(s))}</strong>
       <span>${esc(weightText(s))}${s.done?' ✓':''}</span>
      </button>
     `).join('')}
    </div>
   </div>
  </div>`;
 }).join('')}
 </div>

 ${rituals.cool}

 <div class="actions">
  <button class="primary" id="finishWorkout"
   ${done===0?'disabled':''}>
   Save Workout · ${done}/${total} sets
  </button>
  <button class="secondary" id="resetDraft">
   Reset Unsaved Sets
  </button>
 </div>

 <div class="note">
  Dumbbell loads are suggested starting points, not mandatory
  increases. Tap a set to record the actual repetitions and weight.
  Your completed sessions appear in History and Strength.
 </div>`;
}

function renderPlan(){
 return `${top('YOUR TRAINING ROADMAP','12-Week Plan')}
 <p class="muted">
  Three four-week phases, built around squatting, hinging,
  pressing, pulling, single-leg work and core stability.
 </p>
 <div class="grid2">
 ${Array.from({length:12},(_,i)=>{
  const w=i+1;
  const phase=phaseIndex(w)+1;
  return `
   <div class="card panel">
    <div class="eyebrow" style="margin-top:0">
     PHASE ${phase}
    </div>
    <h2>Week ${w}</h2>
    <p class="small">
     ${phase===1?'Build consistency and technique':
       phase===2?'Build volume and confidence':
       'Consolidate strength and control'}
    </p>
    <div class="small">
     ${PHASES[phase-1].map(x=>esc(x[0])).join(' · ')}
    </div>
    <div class="actions">
     <button class="secondary" data-open-week="${w}">
      View Week ${w}
     </button>
    </div>
   </div>`;
 }).join('')}
 </div>
 <div class="note">
  Progression is based on quality of movement and your completed
  sets. Projected weights are suggestions, not requirements.
 </div>`;
}

function renderHistory(){
 const logs=state.logs.slice().sort((a,b)=>
  String(b.date).localeCompare(String(a.date))
 );

 return `${top('YOUR CONSISTENCY','Workout History')}
 <div class="grid2">
  <div class="card stat">
   <label>Saved workouts</label>
   <strong>${logs.length}</strong>
  </div>
  <div class="card stat">
   <label>Completed sets recorded</label>
   <strong>${logs.reduce((n,l)=>n+Number(l.completed||0),0)}</strong>
  </div>
 </div>

 <div class="panel card">
  <h2>Your sessions</h2>
  ${logs.length?logs.map(l=>`
   <div class="history-item">
    <strong>${esc(l.title||'Workout')}</strong>
    <div class="small">
     ${esc(l.date||'Date unavailable')}
     ${l.week?' · Week '+esc(l.week):''}
     ${l.completed!=null?
       ' · '+esc(l.completed)+'/'+esc(l.total||'?')+' sets':''}
    </div>
    ${Array.isArray(l.items)?`
     <details>
      <summary class="small">View recorded sets</summary>
      ${l.items.map(item=>`
       <div style="margin:9px 0">
        <strong>${esc(EXERCISES[item.id]?.name||
          item.name||item.id||'Exercise')}</strong>
        <div class="small">
         ${(item.sets||[]).filter(s=>s.done!==false)
          .map(s=>esc(setText(s))+' × '+esc(weightText(s)))
          .join(' · ')}
        </div>
       </div>
      `).join('')}
     </details>`:''}
   </div>
  `).join(''):
  '<p class="small">Your saved workouts will appear here.</p>'}
 </div>
 ${renderBackup()}`;
}

function renderLibrary(){
 const groups=[...new Set(Object.values(EXERCISES).map(e=>e.group))];
 return `${top('MOVEMENT LIBRARY','Your Exercises')}
 <p class="muted">
  Exercise references for your strength, core and recovery plan.
 </p>
 ${groups.map(group=>`
  <div class="sectionrow">
   <h2>${esc(group)}</h2>
  </div>
  <div class="library-grid">
   ${Object.values(EXERCISES)
    .filter(e=>e.group===group)
    .map(e=>`
     <div class="card library-tile">
      <img src="${img(e.id)}" alt="${esc(e.name)}"
       loading="lazy"
       onerror="this.onerror=null;this.style.visibility='hidden'">
      <div>
       <strong>${esc(e.name)}</strong>
       <small>${esc(e.equipment)}</small>
      </div>
     </div>
    `).join('')}
  </div>
 `).join('')}`;
}

function render(){
 const tabs={
  today:renderToday,
  plan:renderPlan,
  body:renderBody,
  progress:renderStrength,
  history:renderHistory,
  library:renderLibrary
 };
 const fn=tabs[state.tab]||renderToday;
 $('content').innerHTML=fn();

 document.querySelectorAll('[data-tab]').forEach(b=>{
  b.classList.toggle('active',b.dataset.tab===state.tab)
 });

 $('topDate').textContent=new Date().toLocaleDateString(
  'en-US',{weekday:'short',month:'short',day:'numeric'}
 );
}

function openSetEditor(itemIndex,setIndex){
 const {draft}=workout(state.selectedWeek,state.selectedDay);
 const item=draft.items[itemIndex];
 const set=item?.sets?.[setIndex];
 if(!item||!set)return;

 const e=EXERCISES[item.id];
 const modal=$('modalRoot');

 modal.innerHTML=`
 <div class="modalback">
  <div class="modal" role="dialog" aria-modal="true"
   aria-label="Record workout set">
   <h2>${esc(e.name)}</h2>
   <p class="small">Set ${setIndex+1} · Record what you actually did</p>
   <form id="setEditor">
    <div class="formgrid">
     <div class="field">
      <label>Repetitions or duration</label>
      <input name="reps" required
       value="${esc(set.reps)}">
     </div>
     <div class="field">
      <label>Weight (lb)</label>
      <input name="weight" type="number"
       min="0" step="0.5"
       value="${Number(set.weight)||0}">
     </div>
    </div>
    <div class="actions">
     <button class="primary" type="submit">
      Save & Complete Set
     </button>
     <button class="secondary" type="button"
      id="cancelSet">Cancel</button>
     ${set.done?`
      <button class="secondary" type="button"
       id="undoSet">Mark Incomplete</button>`:''}
    </div>
   </form>
  </div>
 </div>`;

 $('setEditor').addEventListener('submit',ev=>{
  ev.preventDefault();
  const data=new FormData(ev.target);
  const weight=Number(data.get('weight'));
  const reps=String(data.get('reps')||'').trim();

  if(!reps||!Number.isFinite(weight)||weight<0){
   alert('Enter valid repetitions and weight.');
   return;
  }

  set.reps=reps;
  set.weight=weight;
  set.done=true;
  save();
  modal.innerHTML='';
  render();
 });

 $('cancelSet').onclick=()=>modal.innerHTML='';
 if($('undoSet'))$('undoSet').onclick=()=>{
  set.done=false;
  save();
  modal.innerHTML='';
  render();
 };
}

function saveWorkout(){
 const w=state.selectedWeek,d=state.selectedDay;
 const {p,draft}=workout(w,d);
 const {done,total}=counts(draft);
 if(!done)return;

 const today=dateLocal(new Date());
 const log={
  id:'session-'+Date.now()+'-'+Math.random().toString(36).slice(2,8),
  date:today,
  week:w,
  day:d,
  title:p.title,
  type:p.type,
  completed:done,
  total,
  items:JSON.parse(JSON.stringify(draft.items))
 };

 state.logs.push(log);
 delete state.drafts[draftKey(w,d)];
 save();
 state.tab='history';
 render();
 alert('Workout saved to your history.');
}

function exportData(){
 const payload={
  app:'Forme AI',
  exportedAt:new Date().toISOString(),
  state,
  rawStorage:{}
 };

 // Include all Forme-related keys without altering them.
 for(let i=0;i<localStorage.length;i++){
  const k=localStorage.key(i);
  if(k&&/forme/i.test(k)){
   payload.rawStorage[k]=localStorage.getItem(k);
  }
 }

 const blob=new Blob(
  [JSON.stringify(payload,null,2)],
  {type:'application/json'}
 );
 const url=URL.createObjectURL(blob);
 const a=document.createElement('a');
 a.href=url;
 a.download='forme-ai-backup-'+dateLocal(new Date())+'.json';
 document.body.appendChild(a);
 a.click();
 a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),1000);
}

async function importData(file){
 if(!file)return;

 try{
  const payload=JSON.parse(await file.text());
  if(payload.app!=='Forme AI'||!payload.state||
     !Array.isArray(payload.state.logs)){
   throw Error('This is not a valid Forme AI backup.');
  }

  if(!confirm(
   'Restore this backup? It will replace the workout and body data '+
   'currently shown in this version of Forme AI. '+
   'Export your current backup first.'
  ))return;

  state={
   ...defaultState(),
   ...payload.state
  };

  save();
  render();
  alert('Backup restored.');
 }catch(e){
  alert('Could not restore backup: '+e.message);
 }
}

function handleBodyEntry(form){
 const data=new FormData(form);
 const date=String(data.get('date')||'');
 if(!date)return;

 const row={date:new Date(date).toISOString()};
 const fields=['weight','bodyFat','muscle','water','bmi','bone'];

 for(const k of fields){
  const raw=String(data.get(k)||'').trim();
  row[k]=raw===''?null:Number(raw);
  if(row[k]!=null&&(!Number.isFinite(row[k])||row[k]<0)){
   alert('Please check '+k);
   return;
  }
 }

 if(fields.every(k=>row[k]==null)){
  alert('Enter at least one measurement.');
  return;
 }

 // Replace a matching timestamp only after confirmation.
 const index=state.bodyHistory.findIndex(x=>x.date===row.date);
 if(index>=0){
  if(!confirm('Replace the measurement at this date and time?'))return;
  state.bodyHistory[index]=row;
 }else{
  state.bodyHistory.push(row);
 }

 state.bodyHistory.sort((a,b)=>a.date.localeCompare(b.date));
 save();
 render();
}

document.addEventListener('click',async ev=>{
 const tab=ev.target.closest('[data-tab]');
 if(tab){
  state.tab=tab.dataset.tab;
  save();
  render();
  return;
 }

 const day=ev.target.closest('[data-day]');
 if(day){
  state.selectedDay=Number(day.dataset.day);
  save();
  render();
  return;
 }

 const week=ev.target.closest('[data-open-week]');
 if(week){
  state.selectedWeek=Number(week.dataset.openWeek);
  state.selectedDay=0;
  state.tab='today';
  save();
  render();
  return;
 }

 const set=ev.target.closest('[data-set]');
 if(set){
  const [i,j]=set.dataset.set.split(':').map(Number);
  openSetEditor(i,j);
  return;
 }

 if(ev.target.closest('#finishWorkout')){
  if(confirm('Save the completed sets to your workout history?'))
   saveWorkout();
  return;
 }

 if(ev.target.closest('#resetDraft')){
  if(confirm('Reset unsaved sets for this workout?')){
   delete state.drafts[draftKey(state.selectedWeek,state.selectedDay)];
   save();
   render();
  }
  return;
 }

 if(ev.target.closest('#exportData')){
  exportData();
  return;
 }

 if(ev.target.closest('#pasteImport')){
  const text=$('bodyCSV')?.value||'';
  try{
   const n=parseBodyCSV(text);
   render();
   alert(n+' new Weight Gurus measurements imported.');
  }catch(e){
   alert(e.message);
  }
  return;
 }
});

document.addEventListener('change',async ev=>{
 const t=ev.target;

 if(t.id==='todayWeek'){
  state.selectedWeek=Number(t.value);
  save();
  render();
  return;
 }

 if(t.id==='bodyMetric'){
  state.bodyMetric=t.value;
  save();
  render();
  return;
 }

 if(t.id==='bodyWindow'){
  state.bodyWindow=Number(t.value);
  save();
  render();
  return;
 }

 if(t.matches('[data-ritual]')){
  const key=state.selectedWeek+'-'+state.selectedDay;
  if(!state.mobilityChecks)state.mobilityChecks={};
  if(!state.mobilityChecks[key])state.mobilityChecks[key]={};
  state.mobilityChecks[key][t.dataset.ritual]=t.checked;
  save();
  return;
 }

 if(t.id==='bodyFile'&&t.files?.[0]){
  try{
   const text=await t.files[0].text();
   const n=parseBodyCSV(text);
   render();
   alert(n+' new Weight Gurus measurements imported.');
  }catch(e){
   alert('CSV import failed: '+e.message);
  }
  return;
 }

 if(t.id==='importData'&&t.files?.[0]){
  await importData(t.files[0]);
  return;
 }
});

document.addEventListener('submit',ev=>{
 if(ev.target.id==='bodyEntry'){
  ev.preventDefault();
  handleBodyEntry(ev.target);
 }
});

// Initialize the app without clearing existing browser storage.
load();
render();

</script>
</body>
</html>
